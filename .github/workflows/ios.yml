name: iOS

# Ordinary PR pushes only report the lightweight iOS gate. Heavy verification
# runs on the run-full-ci label event, main, merge queue, nightly or dispatch.

on:
  # No path filter: the `iOS gate` check is required on main, so every PR
  # revision must receive a conclusion. The changes job below decides whether
  # the heavy jobs run.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "apps/mobile-bindings/**"
      - "core/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/repo/**"
      - "repo"
      - ".github/workflows/ios.yml"
      - ".github/actions/select-ios-simulator/**"
  schedule:
    # 02:47 Asia/Shanghai, before the 03:17 full-integration sweep.
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which plan to verify: unit, UI smoke, the full UI plan, or the stack integration plan.'
        type: choice
        options: [full, smoke, unit, integration]
        default: full

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  # Separate quick and requested runs so an ordinary push cannot cancel a full
  # verification. A repeated request cancels the superseded requested run.
  group: ios-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-ci') && 'full' || 'automatic' }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect iOS-facing changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.diff.outputs.build }}
      integration: ${{ steps.diff.outputs.integration }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - name: Check out the merge revision
        if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-full-ci')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare the tested revision
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          SUITE: ${{ inputs.suite }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && { [ "$ACTION" != labeled ] || [ "$LABEL" != run-full-ci ]; }; then
            {
              echo 'build=false'
              echo 'integration=false'
              echo 'matrix={"include":[]}'
            } >> "$GITHUB_OUTPUT"
            echo 'iOS verification not requested: add run-full-ci to test this revision.'
            exit 0
          fi
          # The helper owns the path filter, matrix selection and the
          # scheduled/manual stack integration decision.
          python3 tools/repo/src/repo/ci.py ios-plan \
            --event "${EVENT:-}" \
            --action "${ACTION:-}" \
            --label "${LABEL:-}" \
            --suite "${SUITE:-}" \
            --base "${BASE_SHA:-}" \
            --head "${HEAD_SHA:-}" >> "$GITHUB_OUTPUT"

  native:
    name: iOS native verification (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.runner || 'xcode-27' }}
    timeout-minutes: 90
    env:
      XCODE_VERSION: ${{ matrix.xcode || '27.2' }}
      DEVELOPER_DIR: ${{ format('/Applications/Xcode_{0}.app/Contents/Developer', matrix.xcode || '27.2') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the Xcode version
        run: xcodebuild -version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Rust iOS targets
        run: rustup target add aarch64-apple-ios-sim

      - name: Install protoc for the bindings build
        run: brew install protobuf

      - name: Restore Rust simulator build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .data/ios-build/source/target
          key: rust-ios-sim-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-ios-sim-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            rust-ios-sim-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Select an available iPhone simulator
        id: simulator
        uses: ./.github/actions/select-ios-simulator
        with:
          ios-major: ${{ matrix.ios_major || '27' }}

      - name: Run native test selection
        shell: bash
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=("$TARGET" --simulator "$SIMULATOR" --output .data/runs/ios-ci)
          if [ -n "$SHARD" ]; then
            args+=(--shard "$SHARD")
          fi
          ./repo test "${args[@]}"

      - name: Save Rust simulator build cache
        if: ${{ matrix.target == 'ios-unit' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .data/ios-build/source/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Scan the Release product for the debug surface
        if: matrix.name == 'unit'
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          DERIVED_DATA: .data/ios-release-scan
        run: |
          set -euo pipefail
          # `repo test` builds the bindings in its mirrored source tree; use
          # that checkout when the workspace has no generated framework.
          scan_root=apps/ios
          if [[ -d .data/ios-build/source/apps/ios/Vendor/WhaleReinMobile.xcframework ]]; then
            scan_root=.data/ios-build/source/apps/ios
          fi
          DESTINATION="platform=iOS Simulator,id=${SIMULATOR}" \
            "$scan_root/scripts/release-surface-scan.sh"

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: |
            .data/runs/ios-ci/report.json
            .data/runs/ios-ci/report.html
            .data/runs/ios-ci/native.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  integration:
    name: iOS stack integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    # The fixture stack runs Docker, Go, Node and pnpm next to Xcode. Hosted
    # macOS runners do not provide a Docker daemon, so the repository defines
    # WHALEREIN_IOS_STACK_RUNNER for a self-hosted macOS runner with Docker.
    runs-on: ${{ vars.WHALEREIN_IOS_STACK_RUNNER || 'macos-15' }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the Xcode version
        run: xcodebuild -version

      - name: Verify the Docker daemon
        run: docker info --format '{{.Architecture}}'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Go for the fixture stack
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum

      - name: Set up Node.js and pnpm for the fixture stack
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Set up pnpm
        run: npm install --global pnpm@12.21.0

      - name: Set up Rust iOS targets
        run: rustup target add aarch64-apple-ios-sim

      - name: Install protoc for the bindings build
        run: brew install protobuf

      - name: Select an available iPhone simulator
        id: simulator
        uses: ./.github/actions/select-ios-simulator

      - name: Run the stack-backed integration plan
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
        run: ./repo test ios-integration --simulator "$SIMULATOR" --output .data/runs/ios-integration

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .data/runs/ios-integration/report.json
            .data/runs/ios-integration/report.html
            .data/runs/ios-integration/native.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  architecture:
    name: iOS architecture gate
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce client architecture boundaries
        run: python3 apps/ios/scripts/architecture_gate.py

  gate:
    name: iOS gate
    if: always() && !cancelled()
    needs: [changes, native, integration, architecture]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.build }}
          NATIVE_RESULT: ${{ needs.native.result }}
          INTEGRATION_REQUIRED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$ARCHITECTURE_RESULT" = success
          case "$NATIVE_REQUIRED" in
            true) test "$NATIVE_RESULT" = success ;;
            false) test "$NATIVE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
          case "$INTEGRATION_REQUIRED" in
            true) test "$INTEGRATION_RESULT" = success ;;
            false) test "$INTEGRATION_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
