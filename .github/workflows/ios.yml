name: iOS

# Ordinary PR pushes only report the lightweight iOS gate. Heavy verification
# runs on the run-full-ci label event, main, merge queue, nightly or dispatch.

on:
  # No path filter: the `iOS gate` check is required on main, so every PR
  # revision must receive a conclusion. The changes job below decides whether
  # the heavy jobs run.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "apps/mobile-bindings/**"
      - "core/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tools/repo/**"
      - "repo"
      - ".github/workflows/ios.yml"
      - ".github/actions/select-ios-simulator/**"
  schedule:
    # 02:47 Asia/Shanghai, before the 03:17 full-integration sweep.
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which plan to verify: the unit plan, a UI smoke selection, or the full UI plan.'
        type: choice
        options: [full, smoke, unit]
        default: full

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  # Separate quick and requested runs so an ordinary push cannot cancel a full
  # verification. A repeated request cancels the superseded requested run.
  group: ios-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'run-full-ci') && 'full' || 'automatic' }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect iOS-facing changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.diff.outputs.build }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - name: Check out the merge revision
        if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-full-ci')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare the tested revision
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          SUITE: ${{ inputs.suite }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ] && { [ "$ACTION" != labeled ] || [ "$LABEL" != run-full-ci ]; }; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'iOS verification not requested: add run-full-ci to test this revision.'
            exit 0
          fi
          case "$EVENT" in
            pull_request|merge_group)
              changed=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" --) ;;
            *)
              # Main, scheduled and manual runs always verify the full tier.
              changed=$'apps/ios/app\n' ;;
          esac
          build=false
          if printf '%s\n' "$changed" | grep -qE '^(apps/ios/|apps/mobile-bindings/|core/|proto/|Cargo\.(toml|lock)|rust-toolchain\.toml|tools/repo/|repo$|\.github/(workflows/ios\.yml|actions/select-ios-simulator/))'; then
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os

          jobs = [{"name": "unit", "target": "ios-unit", "shard": ""}]
          suite = os.environ.get("SUITE", "")
          if suite == "smoke":
              jobs.append({"name": "smoke", "target": "ios-ui-smoke", "shard": ""})
          elif suite != "unit":
              for index in range(1, 5):
                  jobs.append({"name": f"ui-{index}", "target": "ios-ui", "shard": f"{index}/4"})
          print("matrix=" + json.dumps({"include": jobs}, separators=(",", ":")))
          PYTHON
          fi

  native:
    name: iOS native verification (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the Xcode version
        run: xcodebuild -version

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Rust iOS targets
        run: rustup target add aarch64-apple-ios-sim

      - name: Install protoc for the bindings build
        run: brew install protobuf

      - name: Restore Rust simulator build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .data/ios-build/source/target
          key: rust-ios-sim-xcode16.4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-ios-sim-xcode16.4-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            rust-ios-sim-xcode16.4-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Select an available iPhone simulator
        id: simulator
        uses: ./.github/actions/select-ios-simulator

      - name: Run native test selection
        shell: bash
        env:
          SIMULATOR: ${{ steps.simulator.outputs.udid }}
          TARGET: ${{ matrix.target }}
          SHARD: ${{ matrix.shard }}
        run: |
          args=("$TARGET" --simulator "$SIMULATOR" --output .data/runs/ios-ci)
          if [ -n "$SHARD" ]; then
            args+=(--shard "$SHARD")
          fi
          ./repo test "${args[@]}"

      - name: Save Rust simulator build cache
        if: ${{ matrix.name == 'unit' && steps.rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .data/ios-build/source/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: |
            .data/runs/ios-ci/report.json
            .data/runs/ios-ci/report.html
            .data/runs/ios-ci/native.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  gate:
    name: iOS gate
    if: always() && !cancelled()
    needs: [changes, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.build }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          case "$NATIVE_REQUIRED" in
            true) test "$NATIVE_RESULT" = success ;;
            false) test "$NATIVE_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
