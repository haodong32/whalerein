name: iOS

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/mobile-bindings/**"
      - "core/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"
  push:
    branches:
      - main
    paths:
      - "apps/ios/**"
      - "apps/mobile-bindings/**"
      - "core/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and simulator tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Set up Rust iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version

      - name: Install protoc for the bindings build
        run: brew install protobuf

      - name: Cache Rust dependencies and iOS builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ios-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-ios-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            rust-ios-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Build Rust XCFramework and Swift bindings
        run: bash apps/mobile-bindings/scripts/build-xcframework.sh

      - name: Run Swift unit tests
        run: |
          xcodebuild test \
            -project apps/ios/WhaleRein.xcodeproj \
            -scheme WhaleRein \
            -testPlan Unit \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath .local-docs/acceptance/add-ios-client/xcode/Unit.xcresult

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project apps/ios/WhaleRein.xcodeproj \
            -scheme WhaleRein \
            -testPlan UI \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -resultBundlePath .local-docs/acceptance/add-ios-client/xcode/UI.xcresult

      - name: Upload iOS result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-${{ github.sha }}-${{ github.run_attempt }}
          path: .local-docs/acceptance/add-ios-client/xcode/*.xcresult
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
