name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected projects
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      rust: ${{ steps.changes.outputs.rust }}
      go: ${{ steps.changes.outputs.go }}
      node: ${{ steps.changes.outputs.node }}
      python: ${{ steps.changes.outputs.python }}
      native: ${{ steps.changes.outputs.native }}
      contract: ${{ steps.changes.outputs.contract }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Go for workflow lint
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Select projects
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          matrix=$(python3 tools/repo/src/repo/ci.py plan --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          python3 - "$matrix" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          matrix = json.loads(sys.argv[1])
          kinds = {group["kind"] for group in matrix.get("include", [])}
          projects = {project for group in matrix.get("include", []) for project in group["projects"]}
          for kind in ("rust", "go", "node", "python"):
              print(f'{kind}={"true" if kind in kinds else "false"}')
          print(f'native={"true" if kinds & {"rust", "go", "node"} else "false"}')
          print(f'contract={"true" if "proto" in projects else "false"}')
          PY

  fast:
    name: Checks and coverage (${{ matrix.kind }})
    needs: changes
    if: >-
      needs.changes.outputs.matrix != '{"include": []}'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        if: matrix.kind == 'go' || matrix.kind == 'node'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum

      - name: Set up Go for CLI diagnostics acceptance
        if: matrix.kind == 'rust' && contains(matrix.projects, 'cli')
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        if: matrix.kind == 'node'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.14.0'

      - name: Set up pnpm
        if: matrix.kind == 'node'
        run: npm install --global pnpm@12.18.0

      - name: Restore pnpm cache
        if: matrix.kind == 'node'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.7'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: tools/repo/uv.lock

      - name: Cache Rust dependencies and builds
        if: matrix.kind == 'rust'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'tools/repo/linux-rust-packages.txt') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'tools/repo/linux-rust-packages.txt') }}-${{ hashFiles('Cargo.lock') }}-
            rust-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml', 'tools/repo/linux-rust-packages.txt') }}-

      - name: Cache Rust coverage tool
        if: matrix.kind == 'rust'
        id: coverage-tool
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: llvm-cov-ubuntu-24.04-${{ hashFiles('rust-toolchain.toml') }}-0.9.1

      - name: Set up Rust
        if: matrix.kind == 'rust'
        run: rustc --version

      - name: Install Rust coverage tool
        if: matrix.kind == 'rust' && steps.coverage-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Install Linux Rust build dependencies
        if: matrix.kind == 'rust'
        run: |
          sudo apt-get update
          xargs -r sudo apt-get install --yes < tools/repo/linux-rust-packages.txt

      - name: Set up protocol tools
        if: matrix.kind == 'node'
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript workspace
        if: matrix.kind == 'node'
        run: pnpm install --frozen-lockfile

      - name: Check generated protocol bindings
        if: matrix.kind == 'node'
        run: ./repo proto --check

      - name: Check, build and test selected projects
        env:
          PROJECTS: ${{ toJSON(matrix.projects) }}
        run: uv run --project tools/repo python -m repo.ci run --projects "$PROJECTS"

      - name: Run CLI diagnostics acceptance
        if: matrix.kind == 'rust' && contains(matrix.projects, 'cli')
        env:
          WHALEREIN_ACCEPTANCE_CLI: target/debug/whalerein
        run: go test -tags acceptance ./tests/acceptance -run TestCLIDoctorDegradedEnvironment -count=1 -v -timeout 10m

      - name: Upload reports and local build outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.kind }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .data/runs/**/report.json
            .data/runs/**/report.html
            .data/runs/**/coverage-*.coverprofile
            .data/bin/whalerein-access
            target/debug/whalerein
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  contract:
    name: Contract checks
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.14.0'

      - name: Set up pnpm
        run: npm install --global pnpm@12.18.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.7'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: tools/repo/uv.lock

      - name: Set up protocol tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Check generated protocol bindings
        run: ./repo proto --check

      - name: Check Swift surface drift
        run: |
          python3 proto/v1/bindings/swift/check_swift_surface.py || {
            echo "::error::Swift surface drift. Update proto/v1/bindings/swift/ios-surface.json and the hand-written MobileError mapping together; see proto/v1/bindings/swift/check_swift_surface.py."
            exit 1
          }

      - name: Check protobuf compatibility vectors
        run: |
          python3 tests/integration/drivers/protobuf/proto_compat.py --check || {
            echo "::error::Protobuf compatibility failed. A breaking change needs a version bump and an explicit baseline update with --update-baseline --rationale; see tests/integration/drivers/protobuf/proto_compat.py."
            exit 1
          }

  native:
    name: Native unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        if: needs.changes.outputs.go == 'true'
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        if: needs.changes.outputs.node == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.14.0'

      - name: Set up pnpm
        if: needs.changes.outputs.node == 'true'
        run: npm install --global pnpm@12.18.0

      - name: Restore pnpm cache
        if: needs.changes.outputs.node == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.14.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install JavaScript workspace
        if: needs.changes.outputs.node == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.7'
          python-version: '3.11'

      - name: Set up Rust
        if: needs.changes.outputs.rust == 'true'
        run: |
          rustc --version
          cargo --version

      - name: Cache Rust dependencies and builds
        if: needs.changes.outputs.rust == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            rust-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Run selected native unit tests
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: uv run --project tools/repo python -m repo.ci native --matrix "$MATRIX"

  deployment:
    name: Deployment acceptance
    needs: changes
    if: >-
      needs.changes.outputs.matrix != '{"include": []}'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WHALEREIN_ACCEPTANCE: '1'
      WHALEREIN_ACCEPTANCE_RESTART_ACCESS: 'docker compose -f deploy/compose/stack.yaml restart access'
      WHALEREIN_ACCEPTANCE_RESTART_BROKER: 'docker compose -f deploy/compose/stack.yaml restart mosquitto'
      WHALEREIN_ACCEPTANCE_RESTART_POSTGRES: 'docker compose -f deploy/compose/stack.yaml restart postgres'
      WHALEREIN_ACCEPTANCE_STOP_ACCESS: 'docker stop --time 20 whalerein-access'
      WHALEREIN_ACCEPTANCE_START_ACCESS: 'docker start whalerein-access'
      WHALEREIN_ACCEPTANCE_ACCESS_CONTAINER: whalerein-access
      WHALEREIN_ACCEPTANCE_POSTGRES_CONTAINER: whalerein-postgres
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: go.sum

      - name: Build and start the Compose stack
        run: docker compose -f deploy/compose/stack.yaml up -d --build

      - name: Wait for Access readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/stack.yaml ps
          exit 1

      - name: Run deployment acceptance
        run: >-
          go test -tags acceptance ./tests/acceptance
          -run 'TestMosquittoLineAcceptance|TestPostgresRestartAndReadOnlyFence|TestGracefulShutdownAndLogRotation|TestBackupRestoreCannotResurrectGrantOrDuplicateCommand|TestRequestMetadataRetentionPolicy'
          -count=1 -v -timeout 30m

      - name: Capture stack state and logs
        if: always()
        run: |
          mkdir -p .data/runs/deployment
          docker compose -f deploy/compose/stack.yaml ps > .data/runs/deployment/ps.txt 2>&1 || true
          docker compose -f deploy/compose/stack.yaml logs --no-color > .data/runs/deployment/stack.log 2>&1 || true

      - name: Upload deployment acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .data/runs/deployment/stack.log
            .data/runs/deployment/ps.txt
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Tear down the Compose stack
        if: always()
        run: docker compose -f deploy/compose/stack.yaml down -v

  gate:
    name: CI gate
    if: always()
    needs: [changes, fast, contract, native, deployment]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.fast.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          CONTRACT_REQUIRED: ${{ needs.changes.outputs.contract }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$MATRIX" = '{"include": []}' ]; then
            test "$TEST_RESULT" = skipped
            test "$NATIVE_RESULT" = skipped
            test "$CONTRACT_RESULT" = skipped
            test "$DEPLOYMENT_RESULT" = skipped
          else
            test "$TEST_RESULT" = success
            test "$DEPLOYMENT_RESULT" = success
            if [ "$NATIVE_REQUIRED" = true ]; then
              test "$NATIVE_RESULT" = success
            else
              test "$NATIVE_RESULT" = skipped
            fi
            if [ "$CONTRACT_REQUIRED" = true ]; then
              test "$CONTRACT_RESULT" = success
            else
              test "$CONTRACT_RESULT" = skipped
            fi
          fi
