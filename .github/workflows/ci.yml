name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Quick checks (${{ matrix.kind }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Kotlin is the JDK-only Android state module. It never installs the
        # Android SDK/NDK and never runs a device suite.
        kind: [rust, go, node, kotlin, python]
    steps:
      - name: Start quick-check timer
        run: echo "QUICK_CI_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected projects
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          KIND: ${{ matrix.kind }}
        run: |
          python3 tools/repo/src/repo/ci.py quick-plan --base "$BASE_SHA" --head "$HEAD_SHA" --kind "$KIND" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.selection.outputs.selected == 'true' && (matrix.kind == 'go' || matrix.kind == 'node')
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: go.sum
      - name: Lint workflows
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'go'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Set up Node.js
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Set up pnpm
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'node'
        run: npm install --global pnpm@12.21.0
      - name: Restore pnpm cache
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JavaScript workspace
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'node'
        run: pnpm install --frozen-lockfile
      - name: Set up uv and Python
        if: steps.selection.outputs.selected == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
          python-version: '3.15.2'
          enable-cache: true
          cache-dependency-glob: tools/repo/uv.lock
      - name: Set up JDK 21 for the Android state module
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle for the Android state module
        if: steps.selection.outputs.selected == 'true' && matrix.kind == 'kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-state-ubuntu-26.04-${{ hashFiles('apps/android/gradle/wrapper/gradle-wrapper.properties', 'apps/android/gradle/libs.versions.toml', 'apps/android/state/build.gradle.kts', 'apps/android/state/settings.gradle.kts') }}
          restore-keys: |
            gradle-state-ubuntu-26.04-
      - name: Run quick checks
        if: steps.selection.outputs.selected == 'true'
        env:
          PROJECTS: ${{ steps.selection.outputs.projects }}
        run: uv run --project tools/repo python -m repo.ci quick --projects "$PROJECTS"
      - name: Upload quick-check reports
        if: always() && steps.selection.outputs.selected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-${{ matrix.kind }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .data/runs/**/report.json
            .data/runs/**/report.html
            apps/android/state/build/test-results/test/*.xml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Report quick-check duration
        if: always() && env.QUICK_CI_STARTED_AT != ''
        run: |
          elapsed=$(( $(date +%s) - QUICK_CI_STARTED_AT ))
          echo "Quick-check job duration: ${elapsed}s (target: 180s)."
          if [ "$elapsed" -gt 180 ]; then
            echo "::warning::Quick checks exceeded the three-minute target (${elapsed}s). Test results still determine success."
          fi

  gate:
    name: CI gate
    if: always() && !cancelled()
    needs: fast
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require every quick check
        env:
          RESULT: ${{ needs.fast.result }}
        run: test "$RESULT" = success
