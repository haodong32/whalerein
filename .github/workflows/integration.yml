name: Integration

# Trigger tiers:
# - pull request: quiet unless the `run-integration` label is attached. The job
#   still runs so the `Full integration` check reports a result for every
#   revision; it simply skips the heavy suite.
# - merge queue: always runs against the exact tree about to land.
# - nightly schedule, manual dispatch and reusable release calls: run the
#   complete suite, with the scheduled baseline skip described in docs/testing.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      revision:
        description: 'Main commit to verify (empty uses the dispatch commit)'
        type: string
        default: ''
  workflow_call:
    inputs:
      revision:
        description: 'Exact main commit required by the release caller'
        required: true
        type: string
    outputs:
      tested_revision:
        description: 'Commit verified by the full integration suite'
        value: ${{ jobs.integration.outputs.tested_revision }}

permissions:
  contents: read

# Pull-request and merge-queue runs queue per revision; scheduled, manual and
# release runs share one global slot so a release check is never cancelled.
concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' && format('integration-pr-{0}', github.event.pull_request.number)) ||
        (github.event_name == 'merge_group' && format('integration-queue-{0}', github.event.merge_group.head_sha)) ||
        'whalerein-full-integration' }}
  cancel-in-progress: false

jobs:
  integration:
    name: Full integration
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      tested_revision: ${{ steps.result.outputs.revision }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Freeze and identify inputs
        id: inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$DEFAULT_BRANCH" = main
          revision=$(git rev-parse HEAD)
          # Pull-request and merge-queue commits are synthetic merges of the
          # proposal and main; they are not ancestors of main but they are the
          # trees that would land, so they are still the verified revision.
          case "$EVENT" in
            pull_request|merge_group) ;;
            *) git merge-base --is-ancestor "$revision" origin/main ;;
          esac
          key=$(python3 tools/repo/src/repo/integration_ci.py key --revision "$revision")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore successful input record
        id: baseline
        if: github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/integration-passed
          key: integration-pass-ubuntu-26.04-v1-${{ steps.inputs.outputs.key }}

      - name: Decide whether to run
        id: selection
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CACHE_HIT: ${{ steps.baseline.outputs.cache-hit }}
          REVISION: ${{ steps.inputs.outputs.revision }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              # Only the label event itself requests the suite. Later pushes
              # keep the check reporting without spending the heavy run.
              if [ "$ACTION" = labeled ] && printf '%s' "$LABELS" | grep -q '"run-integration"'; then
                echo "verified_revision=$REVISION" >> "$GITHUB_OUTPUT"
                echo 'run=true' >> "$GITHUB_OUTPUT"
              else
                echo "verified_revision=$REVISION" >> "$GITHUB_OUTPUT"
                echo 'run=false' >> "$GITHUB_OUTPUT"
                echo 'Full integration skipped: add the run-integration label to request it.'
              fi
              ;;
            merge_group|workflow_dispatch|workflow_call)
              echo "verified_revision=$REVISION" >> "$GITHUB_OUTPUT"
              echo 'run=true' >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              prior=$(python3 tools/repo/src/repo/integration_ci.py cached --revision "$REVISION" --output .data/integration-passed/receipt.json)
              if [ "$CACHE_HIT" = true ] && [ -n "$prior" ]; then
                echo "verified_revision=$prior" >> "$GITHUB_OUTPUT"
                echo 'run=false' >> "$GITHUB_OUTPUT"
                echo 'Full integration skipped: these relevant inputs already passed.'
              else
                echo "verified_revision=$REVISION" >> "$GITHUB_OUTPUT"
                echo 'run=true' >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "verified_revision=$REVISION" >> "$GITHUB_OUTPUT"
              echo 'run=true' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up uv and Python
        if: steps.selection.outputs.run == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.15.2'
          enable-cache: true
          cache-dependency-glob: tools/repo/uv.lock

      - name: Prepare storage on the disposable runner
        if: steps.selection.outputs.run == 'true'
        run: bash tools/repo/prepare-integration-storage.sh

      - name: Run the complete isolated suite
        if: steps.selection.outputs.run == 'true'
        id: tests
        run: ./repo test --suite integration --output .data/runs/integration

      - name: Record complete success
        if: >-
          steps.tests.outcome == 'success' &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        env:
          REVISION: ${{ steps.inputs.outputs.revision }}
        run: >-
          python3 tools/repo/src/repo/integration_ci.py record
          --revision "$REVISION"
          --report .data/runs/integration/report.json
          --output .data/integration-passed/receipt.json

      - name: Retain successful baseline
        if: >-
          success() && steps.tests.outcome == 'success' &&
          steps.baseline.outputs.cache-hit != 'true' &&
          github.event_name != 'pull_request' &&
          github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .data/integration-passed
          key: integration-pass-ubuntu-26.04-v1-${{ steps.inputs.outputs.key }}

      - name: Upload reports and verification record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .data/runs/integration/report.json
            .data/runs/integration/report.html
            .data/integration-passed/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Expose verified revision
        id: result
        env:
          REVISION: ${{ steps.selection.outputs.verified_revision }}
        run: echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
