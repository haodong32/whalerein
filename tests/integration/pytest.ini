[pytest]
addopts = -ra --tb=short
markers =
    description(text): source-authored condition and expected behavior for this parameterized case
    protocol: cross-language protocol cases
    chain: full product chain cases
    transport: real MQTT transport cases
    storage: PostgreSQL integration cases
    native-dsh: real DSH and browser journeys with a deterministic local model
    timed_questions: use a test-only timed question preset
    short_approvals: shorten the native approval lifetime for expiry coverage
    privacy_debug_logging: enable debug output for a privacy probe
    wrapper_launcher: run DSH through a nonstandard test-only launcher
    external_launcher: run the official DSH CLI through an external symlink
    privacy_access_info_logging: enable Access info logs for an isolated privacy probe
