[package]
name = "whalerein-proto-peer"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate: it compiles the same proto/v1 contract against prost+pbjson
# without depending on the client workspace.
[workspace]

[dependencies]
hex = "0.4"
pbjson = "0.9"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
pbjson-build = "0.9"
prost-build = "0.14"
