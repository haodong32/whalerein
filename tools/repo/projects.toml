[[projects]]
id = "core"
depends_on = ["proto"]
path = "core"
kind = "rust"

[[projects]]
id = "cli"
depends_on = ["core"]
path = "apps/cli"
kind = "rust"

[[projects]]
id = "proto"
path = "proto/v1/bindings/rust"
kind = "rust"
role = "bindings"

[[projects]]
id = "mobile-bindings"
depends_on = ["core", "proto"]
path = "apps/mobile-bindings"
kind = "rust"
role = "bindings"

[[projects]]
id = "noise-peer"
depends_on = ["core"]
path = "tools/noise-peer"
kind = "rust"
role = "tool"

# The Android JVM state module is a standalone JDK-only Gradle build. It never
# configures an Android plugin, so ordinary PR checks need no Android SDK, NDK
# or device. Android instrumentation suites are explicit `./repo test` targets,
# not registered unit projects.
[[projects]]
id = "android-state"
path = "apps/android/state"
kind = "kotlin"

[[projects]]
id = "access"
path = "."
kind = "go"
sources = ["access", "proto/v1/bindings/go"]
binary = "./access/cmd/server"

[[projects]]
id = "host"
path = "host/runtime"
kind = "node"

[[projects]]
id = "dsh"
depends_on = ["host"]
path = "host/dsh"
kind = "node"

[[projects]]
id = "repo"
path = "tools/repo"
kind = "python"
role = "tool"
coverage_source = "repo"
