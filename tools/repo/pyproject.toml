[project]
name = "whalerein-repo"
version = "0.1.0"
description = "WhaleRein monorepo manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "rich>=13.9,<15",
  # Pinned Perfetto trace builder used by the offline benchmark exporter.
  "perfetto==0.14.0",
]

[project.scripts]
repo = "repo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["behavior(id, ensures): stable behavior identity and guarantee"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["repo"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
