[workspace]
resolver = "2"
members = [
  "proto/v1/bindings/rust",
  "core",
  "apps/cli",
  "apps/mobile-bindings",
  "tools/noise-peer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
whalerein-proto = { path = "proto/v1/bindings/rust" }
whalerein-core = { path = "core" }
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs4 = "1.1"
getrandom = "0.3"
hex = "0.4"
hkdf = "0.12"
prost = "0.14"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
snow = { version = "0.9", features = ["default-resolver"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
