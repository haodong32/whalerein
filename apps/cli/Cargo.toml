[package]
name = "whalerein-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WhaleRein command-line client"

[[bin]]
name = "whalerein"
path = "src/main.rs"

[dependencies]
whalerein-core = { workspace = true }
whalerein-proto = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = { workspace = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
whalerein-core = { workspace = true, features = ["test-support"] }
