mode: standalone
# WhaleRein Access example configuration.
#
# Copy to access/config.yaml and export the referenced environment variables.
# Tokens and passwords are never written here and are never logged.

listen: "127.0.0.1:8080"
internal_listen: "127.0.0.1:8081"
public_url: "https://access.example.com"

database_url: "${WHALEREIN_DATABASE_URL}"
admin_token: "${WHALEREIN_ADMIN_TOKEN}"
host_provisioning_token: "${WHALEREIN_HOST_PROVISIONING_TOKEN}"

broker:
  # Access -> broker. Use tls:// for production.
  url: "${WHALEREIN_BROKER_URL}"
  # URL advertised to clients in whalerein://pair URIs.
  # Official: mqtts://access.example.com:443 (ALPN mqtt).
  # Self-hosted: mqtts://mqtt.example.com:8883.
  public_url: "mqtts://access.example.com:443"
  client_id: "whalerein-access"
  username: "access"
  password: "${WHALEREIN_BROKER_PASSWORD}"
  ca_file: ""
  server_name: ""
  insecure_skip_verify: false
  connect_timeout: 10s
  publish_timeout: 5s
  keep_alive: 30s
  reconnect_min: 500ms
  reconnect_max: 30s

line:
  # Broker policy validity sent with each update. Must exceed heartbeat_interval.
  policy_ttl: 10s
  reconcile_interval: 10s
  heartbeat_interval: 5s
  operation_timeout: 5s

admission:
  # Bounded local grant cache shared by event admission and device ACL checks.
  max_entries: 10000
  ttl: 5m
  load_timeout: 250ms
  max_background_loads: 64

internal:
  callback_token: "${WHALEREIN_INTERNAL_TOKEN}"

http:
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  # Encoded HTTPS result-body bound. When omitted it derives from the selected
  # transport profile as base64 expansion plus JSON framing (default 24 MiB,
  # compact 13 MiB, roomy 45 MiB). A smaller explicit value fails startup.
  # max_body_bytes: 25165824
  # The public ingress establishes the client address in
  # X-Whalerein-Client-IP and overwrites any inbound value. Access trusts it
  # only from these CIDRs; an empty list is a direct deployment.
  # client_address:
  #   trusted_proxies: ["172.28.0.0/24"]
  # Access logs a windowed HMAC pseudonym, never the address. Generate a
  # 256-bit key with `openssl rand -base64 32` and keep it out of files and
  # logs. Without a key, access records carry only the address status.
  # client_reference:
  #   key: "${WHALEREIN_CLIENT_REF_KEY}"
  #   window: monthly   # or daily

transport:
  # Shared encoded transport vocabulary from proto/v1/transport_profiles.json.
  # Profile names are default, compact and roomy. Every override below is
  # optional and must satisfy the same relations; invalid settings fail before
  # /readyz. Configuration changes take effect on process restart only.
  profile: default
  # packet_bytes: 65536
  # packet_overhead_bytes: 4096
  # envelope_bytes: 16777216
  # bulk_concurrency: 4
  # reserved_bytes: 33554432
  # transfer_timeout: 120s
  # CONNECT Receive Maximum and the ordered publisher bounds. Each topic flow
  # keeps FIFO order with bounded waiting depth and bytes; an exhausted queue
  # returns a typed error instead of blocking unrelated flows.
  # receive_maximum: 16
  # send_in_flight: 16
  # send_queue_depth: 1024
  # send_queue_bytes: 33554432
  # Raw ciphertext retained per encrypted result. Omitted derives from the
  # profile envelope and may not exceed it.
  # result_limit_bytes: 16777216

pairing:
  invitation_ttl: 10m
  claim_timeout: 15s
  claim_ttl: 5m
  max_failures: 5

requests:
  max_ttl: 24h
  forward_interval: 500ms
  lease: 30s
  retry_interval: 10s
  max_attempts: 5
  batch_size: 50
  # Raw ciphertext retained per encrypted result. When omitted it derives from
  # the transport profile envelope; the encoded HTTPS response is separately
  # bounded by http.max_body_bytes.
  # max_result_bytes: 16777216

revocation:
  ack_timeout: 10s

presence:
  cache_ttl: 45s

cleanup:
  interval: 1m
  pairing_token_retention: 24h

storage:
  # Node-owned temporary ciphertext for oversized relay payloads and
  # attachment parts. Disabled by default: enable it only with a dedicated,
  # writable quota directory on this Access node. All byte values are raw
  # ciphertext bytes; the filesystem reserve is compared with actual free
  # space before admission.
  enabled: false
  root_dir: "/var/lib/whalerein/payloads"
  # Stable identity of this Access node and the opaque owner id carried in a
  # reference. owner_id defaults to node_id when omitted.
  node_id: "access"
  # owner_id: "access"
  max_object_bytes: 16777216
  max_host_bytes: 268435456
  max_node_bytes: 1073741824
  max_objects: 1024
  max_active_uploads: 16
  free_space_reserve_bytes: 1073741824
  # Hard lifetime cap. A parent request/transfer deadline can only shorten it.
  retention: 24h
  cleanup_interval: 30s
  cleanup_batch: 100
  upload_timeout: 2m
  read_timeout: 60s

protocol:
  version: 1

log:
  level: "info"
