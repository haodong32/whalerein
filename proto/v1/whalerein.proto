syntax = "proto3";

package whalerein.v1;

option go_package = "github.com/whalerein/whalerein/proto/v1/bindings/go;whalereinv1";

// The only wire contract for WhaleRein first version.
//
// HTTPS uses the proto3 JSON encoding of these messages. MQTT carries the
// binary protobuf encoding. There is no second OpenAPI or JSON Schema.
//
// The application protocol version stays 1. The MQTT relay uses one
// coordinated epoch, RELAY_EPOCH_V5 (5): control messages travel inline in one
// MQTT PUBLISH when the full encoded packet fits, or as a packet-sized
// PayloadReference to complete HTTPS ciphertext. Queries and post-pairing Noise
// use the MQTT 5 request/reply lane with Broker-stamped connection identity and
// deadline-derived Message Expiry Interval, while previews travel fire-and-
// forget from the Host on dedicated QoS 0 device topics. There is no fragment,
// reassembly or application receipt protocol and no legacy relay fallback.

// ---------------------------------------------------------------------------
// Enumerations
// ---------------------------------------------------------------------------

// Lowercase enum value names are intentional: proto3 JSON encodes an enum as
// its value name, so the online status strings on the wire are exactly the
// names required by the architecture (received, host_offline, ...).
enum OnlineStatus {
  online_status_unspecified = 0;
  received = 1;
  host_offline = 2;
  rejected = 3;
  host_accepted = 4;
  succeeded = 5;
  failed = 6;
  unknown = 7;
}

enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  // A Noise XX handshake message. `body` is raw Noise bytes.
  REQUEST_KIND_HANDSHAKE = 1;
  // An encrypted query. `body` is an EncryptedFrame.
  REQUEST_KIND_QUERY = 2;
  // An encrypted control command. `body` is an EncryptedFrame.
  REQUEST_KIND_COMMAND = 3;
  // A first-registration pairing claim. `body` is a PairingClaim.
  REQUEST_KIND_PAIRING_CLAIM = 4;
  // Access -> host authorization notice, after Access wrote devices/grants.
  REQUEST_KIND_PAIRING_AUTHORIZE = 5;
  // Access -> host revocation replay notice.
  REQUEST_KIND_REVOCATION = 6;
  // Access -> Host query for Devices with a current Session observation.
  REQUEST_KIND_HOST_CLIENTS = 7;
  // Access -> Host receive advertisement for the Host -> Access hop. `body` is
  // a ReceiveAdvertisement. Internal: a Device request can never submit it.
  REQUEST_KIND_ACCESS_READY = 8;
  // Access -> Host Central-signed App-session permit. `body` is a
  // ScopedAuthority. The Host verifies it independently before installing it.
  REQUEST_KIND_AUTHORITY = 9;
  // Device -> Host proof of possession for the App-session key, bound to the
  // exact Noise transcript. Access relays it but cannot verify the signature.
  REQUEST_KIND_SESSION_PROOF = 10;
  // Bounded status-only exchange for a device that lost the last revocation
  // receipt. Access admits it at the verified HTTPS bootstrap entry and relays
  // it on a restricted service topic without ordinary broker admission. The
  // Host answers only the exact (Host, device key, grant) tuple and exposes no
  // session, grant-edit, enrollment or ticket operation.
  REQUEST_KIND_SELF_STATUS = 11;
}

enum ErrorCode {
  error_code_unspecified = 0;
  invalid_argument = 1;
  unauthorized = 2;
  forbidden = 3;
  not_found = 4;
  conflict = 5;
  expired = 6;
  unsupported_capability = 7;
  protocol_version_incompatible = 8;
  payload_digest_mismatch = 9;
  approval_expired = 10;
  approval_version_mismatch = 11;
  approval_already_resolved = 12;
  approval_unavailable = 13;
  snapshot_required = 14;
  revocations_pending = 15;
  rate_limited = 16;
  internal = 17;
  unavailable = 18;
  payload_too_large = 19;
  // An unfinished pairing intent was invalidated and cannot be committed.
  pairing_fenced = 20;
  // This exact FINISH committed, but its original grant is no longer active.
  pairing_committed_unavailable = 21;
  // Access committed this exact FINISH, but Host confirmation is unavailable.
  pairing_committed_unconfirmed = 22;
  // The Host's serving route is closed or has been superseded by a newer
  // generation. This is a routing outcome, not a policy denial: the Device may
  // refresh the directory and retry on the current node.
  route_stale = 23;
  // Current managed policy refuses this exact scope. A Device must not retry
  // the request on another node; the denial is terminal for the scope.
  policy_denied = 24;
  // The authenticated node is not accepting new placements or has no current
  // authority for the Host.
  node_unavailable = 25;
  // The authenticated Host replaced the channel that owned this observation.
  channel_replaced = 220;
}

enum Capability {
  capability_unspecified = 0;
  sessions = 1;
  events = 2;
  messages = 3;
  approvals = 4;
  interrupt = 5;
  sync = 6;
  snapshot = 7;
}

// Availability of the bounded, credential-masked approval review facts.
enum ApprovalReviewAvailability {
  approval_review_unspecified = 0;
  // Every essential fact was safely established and masked.
  approval_review_complete = 1;
  // Some essential context is unavailable; remote Allow must be withheld.
  approval_review_incomplete = 2;
  // Review is unavailable for this call or this device.
  approval_review_unavailable = 3;
}

enum PairingPhase {
  PAIRING_PHASE_UNSPECIFIED = 0;
  PAIRING_PHASE_HELLO = 1;
  PAIRING_PHASE_FINISH = 2;
  // Internal Access -> host step. Never accepted from a public request.
  PAIRING_PHASE_AUTHORIZE = 3;
  // Internal commit after Access atomically activates the grant.
  PAIRING_PHASE_COMMIT = 4;
}



enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_REJECTED = 3;
  APPROVAL_STATE_EXPIRED = 4;
  APPROVAL_STATE_UNAVAILABLE = 5;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

// Questions can be independently unavailable or unsupported while the rest of
// a session observation keeps working. An absent descriptor is never an empty
// current collection.
enum QuestionAvailability {
  QUESTION_AVAILABILITY_UNSPECIFIED = 0;
  QUESTION_AVAILABILITY_UNSUPPORTED = 1;
  QUESTION_AVAILABILITY_UNAVAILABLE = 2;
  QUESTION_AVAILABILITY_AVAILABLE = 3;
}

// ---------------------------------------------------------------------------
// Relay epoch, transport configuration and receive advertisements
// ---------------------------------------------------------------------------

// One coordinated relay contract. This value is carried as `relay_version` on
// every relay envelope and advertisement and is independent of application
// protocol version 1. A peer that does not advertise RELAY_EPOCH_V5 is
// rejected with protocol_version_incompatible; there is no unframed or
// fragment-based fallback.
//
// Epoch 5 hard-cuts epoch 4: post-pairing Noise establishment, session queries
// and observation checks use MQTT 5 request/reply on the query lane with
// Broker-stamped connection identity and Message Expiry Interval. Device
// previews travel directly from the Host as QoS 0; Access no longer republishes
// them. The command lane keeps its durable HTTPS admission, heartbeat and
// result read. Epoch 4 and earlier are reserved and never accepted; there is no
// dual epoch and no fallback.
enum RelayEpoch {
  RELAY_EPOCH_UNSPECIFIED = 0;
  reserved 3, 4;
  reserved "RELAY_EPOCH_V3", "RELAY_EPOCH_V4";
  // MQTT 5 request/reply query lane, Broker-stamped connection identity,
  // deadline-derived Message Expiry Interval, direct device previews and
  // inline-or-reference history transfer over MQTT QoS 1 and HTTPS objects.
  RELAY_EPOCH_V5 = 5;
}

// Shared packaged transport profile vocabulary. The executable defaults and
// valid alternate profiles live in proto/v1/transport_profiles.json so Access,
// Host and Core validate the same names and relations. A profile never changes
// application protocol version 1 or the relay epoch.
enum TransportProfile {
  TRANSPORT_PROFILE_UNSPECIFIED = 0;
  // 64 KiB packet and 16 MiB logical envelope.
  TRANSPORT_PROFILE_DEFAULT = 1;
  // Smaller deployment profile; see transport_profiles.json.
  TRANSPORT_PROFILE_COMPACT = 2;
  // Larger deployment profile; see transport_profiles.json.
  TRANSPORT_PROFILE_ROOMY = 3;
}

// One validated set of encoded receive limits. All byte counts are encoded
// bytes, never canonical content bytes. A complete message is one MQTT
// envelope; it is never a fragment. `packet_bytes` is the largest complete
// encoded MQTT PUBLISH this receiver accepts, including the fixed header,
// topic name, MQTT 5 properties, outer envelope and ciphertext framing.
message TransportBudget {
  uint32 packet_bytes = 1;
  // Retired fragment geometry. Tags and names stay reserved so an old writer
  // cannot silently repurpose them.
  reserved 2, 3, 7;
  reserved "fragment_payload_bytes", "fragment_count", "fragment_idle_timeout_ms";
  // Largest complete encoded message accepted through any representation.
  uint64 envelope_bytes = 4;
  // Concurrent HTTPS ciphertext transfers admitted for this receiver.
  uint32 bulk_concurrency = 5;
  // Ciphertext bytes this receiver may hold reserved or in flight.
  uint64 reserved_bytes = 6;
  // One bound for a complete HTTPS upload or fetch.
  uint32 transfer_timeout_ms = 8;
}

// A relay receive advertisement. It applies only to the authenticated
// transport connection generation that carried it; a reconnect starts a new
// generation, and a delayed or replayed advertisement can never update a newer
// connection. Access registers an advertisement against the broker-derived
// connection identity, and only receive information crosses this seam. A peer
// cannot raise another peer's limit; every sender takes the minimum of its own
// limit, the broker limit and every advertised limit on the route.
message ReceiveAdvertisement {
  TransportProfile profile = 1;
  TransportBudget budget = 2;
  uint64 connection_generation = 3;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5).
  uint32 relay_version = 4;
}

// The checked purpose of one temporary ciphertext object. The purpose is part
// of the reservation scope; a fetch for a different purpose is denied.
enum PayloadPurpose {
  PAYLOAD_PURPOSE_UNSPECIFIED = 0;
  // Complete HostRequest body for a QUERY or COMMAND.
  PAYLOAD_PURPOSE_REQUEST = 1;
  // Complete HostResult result body for a request.
  PAYLOAD_PURPOSE_RESULT = 2;
  // Complete EventEnvelope payload for a live observation event.
  PAYLOAD_PURPOSE_EVENT = 3;
  // One bounded attachment part body.
  PAYLOAD_PURPOSE_ATTACHMENT_PART = 4;
  // One complete history page body.
  PAYLOAD_PURPOSE_HISTORY_PAGE = 5;
}

// Opaque locator for one complete ciphertext object on its owning Access node.
// A reference confers no authority: the reader must still authenticate and
// match host, device, session, channel, purpose, part and the original grant
// and revocation revisions. `object_id` is 32 lowercase hexadecimal
// characters; `owner_node_id` is an opaque Access node identity. The digest is
// SHA-256 over the exact ciphertext bytes, not over plaintext content.
message PayloadReference {
  string object_id = 1;
  string owner_node_id = 2;
  uint64 ciphertext_bytes = 3;
  bytes sha256 = 4;
  int64 expires_at_unix_ms = 5;
  PayloadPurpose purpose = 6;
}

// Access-owned ciphertext directory. HTTPS bodies use the proto3 JSON encoding
// except for the exact-length PUT upload and the GET ciphertext stream, which
// carry raw ciphertext bytes with length and digest headers.
message RelayObjectReserveRequest {
  uint32 relay_version = 1;
  string host_id = 2;
  string device_id = 3;
  string session_id = 4;
  string channel_id = 5;
  PayloadPurpose purpose = 6;
  // Attachment occurrence or part identity; empty for non-part purposes.
  string part_id = 7;
  uint64 ciphertext_bytes = 8;
  bytes sha256 = 9;
  int64 expires_at_unix_ms = 10;
  // Host authority only; Device callers authenticate with a bearer token.
  int64 signed_at_unix_ms = 11;
  bytes signature = 12;
  // Parent request for a result. Transient query results also carry their
  // Broker connection scope. Pre-admission request bodies have no parent.
  string request_id = 13;
  uint64 enrollment_generation = 14;
  string connection_ref = 15;
}

message RelayObjectReservation {
  string object_id = 1;
  string owner_node_id = 2;
  // Node-scoped upload path under the configured Access origin.
  string upload_path = 3;
  uint64 max_bytes = 4;
  int64 expires_at_unix_ms = 5;
  uint32 upload_timeout_ms = 6;
}

message RelayObjectFinishRequest {
  uint32 relay_version = 1;
  uint64 ciphertext_bytes = 2;
  bytes sha256 = 3;
  int64 signed_at_unix_ms = 4;
  bytes signature = 5;
}

// Metadata returned after finish or by a HEAD-style lookup. The ciphertext
// itself is streamed only by GET; filenames, MIME metadata and content stay
// inside the seal.
message RelayObject {
  string object_id = 1;
  string owner_node_id = 2;
  PayloadPurpose purpose = 3;
  uint64 ciphertext_bytes = 4;
  bytes sha256 = 5;
  int64 expires_at_unix_ms = 6;
}

message RelayObjectDeleteResult {
  // True when this call released a reserved or ready object; false when the
  // exact object was already terminal for the same authorized scope.
  bool cancelled = 1;
}

// Device request metadata bound at submission. Access stores every value with
// the admitted request; replay replaces none. Access validates the result bound
// before forwarding, then requires exact equality of both durable revisions at
// ciphertext release. Access never inspects the encrypted body.
message RequestTransportMetadata {
  // Validated maximum encoded HTTPS result bytes this request accepts.
  uint64 result_max_bytes = 1;
  // Access Host/device grant generation captured at submission.
  uint64 grant_generation = 2;
  // Access Host/device revocation generation captured at submission. A plain
  // Host-scoped revoke bumps only this revision, so it must be fenced too.
  uint64 revocation_generation = 3;
  // Access managed enrollment generation captured at submission. The query
  // lane matches it separately from the grant revision.
  uint64 enrollment_generation = 4;
}

// ---------------------------------------------------------------------------
// Host request / result envelopes
// ---------------------------------------------------------------------------

message CapabilitySet {
  repeated Capability capabilities = 1;
  uint32 protocol_version = 2;
}

message HostRequest {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  RequestKind kind = 4;
  // Empty for handshakes and queries. Control commands carry an opaque random
  // id plus the SHA-256 of the complete body. For a referenced body,
  // payload_digest equals body_reference.sha256.
  string command_id = 5;
  bytes payload_digest = 6;
  int64 expires_at_unix_ms = 7;
  // Diagnostic correlation only. Never an idempotency key.
  string trace_id = 8;
  uint32 protocol_version = 9;
  // Selected secure channel. Empty while a channel is being established.
  string channel_id = 10;
  // Opaque to Access: raw Noise handshake bytes, an EncryptedFrame, a
  // PairingClaim, or a RevocationNotice depending on `kind`. The representation
  // is per hop: Access may rewrite this inline body into body_reference for the
  // next hop using the same message identity and exact ciphertext.
  bytes body = 11;
  // Retired per-direction capability flags. The relay epoch replaces them.
  reserved 12, 13;
  reserved "client_transport_version", "relay_transport_version";
  // Device result bound and grant generation bound by Access at admission.
  RequestTransportMetadata transport = 14;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5). Access rejects a
  // Device request and Host rejects an Access-forwarded request otherwise with
  // protocol_version_incompatible.
  uint32 relay_version = 15;
  // Complete-body locator for a durable QUERY or COMMAND. Exactly one of
  // `body` and `body_reference` is set for those kinds. HANDSHAKE,
  // PAIRING_CLAIM and internal Access notices are small bootstrap bodies and
  // must stay inline, so they never carry body_reference.
  PayloadReference body_reference = 16;
  // Broker-issued `<broker-epoch>:<connection-instance>` for the authenticated
  // Device connection that submitted a query-lane request. Access fills this
  // from the Broker ingress stamp after admission; a Device cannot set it
  // because it never publishes on the Access -> Host lane. Host binds
  // observation ownership and reply affinity to it.
  string connection_ref = 17;
  // Current Host/device grant generation captured by Access at query
  // admission. Host applies its execution fence to this exact scope.
  uint64 grant_generation = 18;
  // Current managed enrollment generation captured by Access at query
  // admission. It is matched separately from the grant revision so a re-added
  // Host or a re-paired client cannot attach to an older query.
  uint64 enrollment_generation = 19;
  // Managed App session that admitted the request. Access fills it from the
  // durable request row; Host uses it to look up the installed authority.
  string device_session_id = 20;
  // The session has an App-session proof key, so Host must require an installed
  // authority before dispatch. Access derives it from device_sessions.
  bool proof_expected = 21;
}

message HostResult {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  OnlineStatus status = 4;
  string command_id = 5;
  bytes payload_digest = 6;
  // Opaque to Access: raw Noise handshake bytes, an EncryptedFrame, or a
  // PairingClaimResult. Access stores it verbatim. As with HostRequest, the
  // representation is per hop and Access may rewrite the same ciphertext into
  // result_reference for the next hop.
  bytes result_body = 7;
  ErrorCode error_code = 8;
  string trace_id = 9;
  // Sanitized diagnostic text. Never contains content, payloads or keys.
  string error_message = 10;
  int64 completed_at_unix_ms = 11;
  uint32 protocol_version = 12;
  string channel_id = 13;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5).
  uint32 relay_version = 14;
  // Exactly one of `result_body` and `result_reference` is set when a result
  // body exists. HostReady, pairing results and internal control results are
  // small bootstrap bodies and stay inline. A packet-sized terminal status may
  // carry neither when the complete body could not be admitted; the recorded
  // outcome is unchanged.
  PayloadReference result_reference = 15;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string trace_id = 3;
  string request_id = 4;
  // Stable authority reason for a denied long-lived observation. A client
  // treats these as terminal and does not reconnect; an empty reason keeps the
  // generic ErrorCode behavior. Values are the documented authority reasons,
  // not free text.
  string reason = 5;
}

message RequestReceipt {
  string request_id = 1;
  OnlineStatus status = 2;
  string command_id = 3;
  int64 expires_at_unix_ms = 4;
}

message RequestState {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  OnlineStatus status = 4;
  string command_id = 5;
  bytes payload_digest = 6;
  bytes result_body = 7;
  ErrorCode error_code = 8;
  string error_message = 9;
  int64 expires_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
  string channel_id = 12;
  // Complete result locator when the body was stored as a reference. Exactly
  // one of result_body and result_reference is present when content exists.
  PayloadReference result_reference = 13;
}

// Scoped, packet-sized result notice published by Access on the Device notice
// topic after the authoritative outcome and durable notice intent commit. It
// carries no plaintext content: only status metadata and, once the ciphertext
// is readable, an opaque reference. Duplicate notices are harmless; Core reads
// the complete result over HTTPS and reconciles by the original request or
// command identity.
message RequestStateNotice {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  OnlineStatus status = 4;
  string command_id = 5;
  int64 updated_at_unix_ms = 6;
  PayloadReference result_reference = 7;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5).
  uint32 relay_version = 8;
}

message HostInfo {
  string host_id = 1;
  bool online = 2;
  uint32 protocol_version = 3;
  string fingerprint = 4;
}

message HostList {
  repeated HostInfo hosts = 1;
}

// ---------------------------------------------------------------------------
// Pairing
// ---------------------------------------------------------------------------

message PairingInvitationRequest {
  string host_id = 1;
  // Host callers set these and send no bearer token. The signature is Ed25519
  // over whalerein/v1/host-auth|invitation|{host_id}||{signed_at_unix_ms}.
  // The seed is the host Noise private key. Administrators omit both fields
  // and authenticate with the admin bearer instead.
  int64 signed_at_unix_ms = 2;
  bytes signature = 3;
}

message PairingInvitation {
  string token = 1;
  string host_id = 2;
  int64 expires_at_unix_ms = 3;
  // whalerein://pair?... The token is embedded once and is never logged.
  string pairing_uri = 4;
}

// Pre-pair directory view for the holder of a valid invitation token. The
// response contains display metadata only: no grant, route, account or
// credential is created or disclosed by this read.
message HostDirectory {
  string host_id = 1;
  string display_name = 2;
  string os_family = 3;
}

message PairingClaimRequest {
  string token = 1;
  // Client-generated, random, opaque. Correlates the two public steps.
  string claim_id = 2;
  PairingPhase phase = 3;
  // Raw Noise XX message (message 1 for HELLO, message 3 for FINISH).
  bytes noise_message = 4;
  string device_id = 5;
  uint32 protocol_version = 6;
  // The user confirmed the host fingerprint shown after HELLO.
  bool confirmed = 7;
  // Client-generated random credential; its hash is authenticated inside Noise FINISH.
  // Never logged or persisted by Access. Required for FINISH.
  string device_token = 8;
}

message PairingClaimResponse {
  string claim_id = 1;
  string host_id = 2;
  PairingPhase phase = 3;
  // Raw Noise XX message returned by the host for HELLO. Empty for FINISH.
  bytes noise_message = 4;
  bytes host_public_key = 5;
  string host_fingerprint = 6;
  string device_id = 7;
  bytes device_public_key = 8;
  // Echo of the client-generated credential after confirmed Host activation.
  string device_token = 9;
  int64 expires_at_unix_ms = 10;
  uint32 protocol_version = 11;
  // Host-assigned opaque grant identity committed for this pairing. Empty for
  // an old Host that predates Host-owned grants; a new Host always sets it on
  // FINISH. It is opaque, stable for the life of the grant and never derived
  // from a label.
  string grant_id = 12;
}

// Access -> host, carried as the body of a REQUEST_KIND_PAIRING_CLAIM request.
message PairingClaim {
  string claim_id = 1;
  // Hex SHA-256 of the one-time token. Bound into the Noise prologue.
  string token_hash = 2;
  PairingPhase phase = 3;
  bytes noise_message = 4;
  string device_id = 5;
  // On AUTHORIZE and COMMIT, identifies the staged device key. On Cloud HELLO
  // and FINISH, names the authorized Device Noise key for peer verification.
  bytes device_public_key = 6;
  int64 expires_at_unix_ms = 7;
  // Access-assigned grant incarnation, populated on COMMIT.
  uint64 grant_generation = 8;
  // SHA-256 of the client transport credential, verified against Noise FINISH.
  bytes device_auth_hash = 9;
}

// Host -> Access, carried as HostResult.result_body for a pairing claim.
message PairingClaimResult {
  bytes noise_message = 1;
  bytes host_public_key = 2;
  string host_fingerprint = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  bool authorized = 6;
  bytes device_auth_hash = 7;
  // The committed Host-owned grant for this candidate. Returned on the COMMIT
  // acknowledgement so Access can pass it to the Device.
  string grant_id = 8;
}

// Access -> host, carried as the body of a REQUEST_KIND_REVOCATION request.
message RevocationNotice {
  string replay_id = 1;
  repeated string device_ids = 2;
  bool final = 3;
  int64 revoked_at_unix_ms = 4;
  // One incarnation per device; missing entries refer only to legacy generation 0.
  map<string, uint64> grant_generations = 5;
}

// Host -> Access, carried as HostResult.result_body for a revocation notice.
message RevocationAck {
  string replay_id = 1;
  repeated string device_ids = 2;
}

// Host -> Access readiness signal, carried as result_body on the result topic
// with an empty request_id and status succeeded. Access answers with a
// REQUEST_KIND_ACCESS_READY request whose body is Access's own
// ReceiveAdvertisement, so the Host knows the Host -> Access hop budget.
message HostReady {
  string host_id = 1;
  int64 connected_at_unix_ms = 2;
  // Ed25519 public key registered on the authenticated MQTT session.
  // The first key for a host is kept. The same key signs Host-origin relay
  // object HTTP requests.
  bytes authorization_public_key = 3;
  // Retired transport version; the relay epoch replaces it.
  reserved 4;
  reserved "transport_version";
  // Host receive limits for the authenticated broker connection generation.
  ReceiveAdvertisement receive = 5;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5). Access refuses to
  // mark an older or unknown epoch Host ready.
  uint32 relay_version = 6;
  // Host route proof. Access forwards this tuple to Central after verifying it
  // observed the authenticated Host transport. Central binds the signature to
  // the serving node and incarnation filled by Access.
  uint64 route_generation = 7;
  string route_challenge = 8;
  int64 route_signed_at_unix_ms = 9;
  bytes route_signature = 10;
  string route_service = 11;
  string route_environment = 12;
  bytes route_signing_public_key = 13;
  bytes route_noise_public_key = 14;
  // Graceful shutdown marker. Access closes the exact open tuple; a transient
  // disconnect leaves it open for the same process to reattach.
  bool route_closing = 15;
  // Human-facing directory metadata. The Host id stays opaque; these fields
  // are bounded display data and never derive the id or authority. Access may
  // show them to the holder of a valid invitation for this Host before any
  // device grant exists.
  string display_name = 16;
  string os_family = 17;
}

// Host-scoped grant revocation. The host id and device id come from the URL.
// The signature covers whalerein/v1/host-auth|revoke|{host_id}|{device_id}|{signed_at_unix_ms}.
message HostGrantRevocation {
  int64 signed_at_unix_ms = 1;
  bytes signature = 2;
}

// ---------------------------------------------------------------------------
// Secure channel
// ---------------------------------------------------------------------------

// Authenticated encryption envelope used after the Noise XX handshake.
// nonce is 12 random bytes; ciphertext is ChaCha20-Poly1305 output.
message EncryptedFrame {
  string channel_id = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
}

// Noise payload for handshake message 1 (initiator -> responder).
message ChannelHello {
  string device_id = 1;
  string host_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string client_nonce = 5;
  // Device receive limits for the channel this authenticated handshake creates.
  ReceiveAdvertisement receive = 6;
  // The exact Host-issued grant this channel expects. The Host snapshots the
  // active (device key, grant) tuple at the first message and installs the
  // channel only if that same tuple is still active at finish. A non-empty
  // value must equal the snapshot; an empty value is only accepted from a
  // legacy Device and never relaxes the Host's own snapshot re-check.
  string grant_id = 7;
}

// Noise payload for handshake message 2 (responder -> initiator).
message ChannelReady {
  string host_id = 1;
  string device_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string host_nonce = 5;
  // Host receive limits for the channel this authenticated handshake creates.
  ReceiveAdvertisement receive = 6;
  // Echo of the grant bound by this channel. Must equal the hello value and the
  // active Host grant for the authenticated device key.
  string grant_id = 7;
}

// Noise payload for pairing message 1.
message PairingHello {
  string device_id = 1;
  string host_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string device_nonce = 5;
  string display_name = 6;
  // OS token reported by the client: linux, macos, ios, windows, android,
  // freebsd, dragonfly, netbsd, openbsd, or solaris. A label only. Access
  // cannot see this Noise field.
  string os = 7;
}

// Noise payload for pairing message 2.
message PairingHelloReply {
  string host_id = 1;
  string device_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string host_nonce = 5;
}

// Noise payload for pairing message 3. Confirms the user-visible fingerprint.
message PairingFinish {
  string device_id = 1;
  string host_id = 2;
  string host_fingerprint = 3;
  bytes device_auth_hash = 4;
}

// Self-status exchange used after the last ordinary grant closes, carried as
// the body of REQUEST_KIND_SELF_STATUS. The Host matches the proven device key
// and claimed grant against its retained row and answers only that tuple.
message SelfStatusRequest {
  string grant_id = 1;
  // Fresh random challenge bound into the purpose-specific Noise exchange.
  bytes challenge = 2;
}

message SelfStatus {
  string grant_id = 1;
  bytes challenge = 2;
  bool active = 3;
  int64 revoked_at_unix_ms = 4;
}

// ---------------------------------------------------------------------------
// Encrypted query and command payloads
// ---------------------------------------------------------------------------

message RequestPayload {
  oneof payload {
    ListSessions list_sessions = 1;
    GetSession get_session = 2;

    GetApproval get_approval = 4;
    GetCommandResult get_command_result = 5;
    SendMessage send_message = 6;
    Interrupt interrupt = 7;
    ResolveApproval resolve_approval = 8;
    Ping ping = 9;
    ListApprovals list_approvals = 10;
    HistoryRead read_history = 11;
    WatchSession watch_session = 12;
    CheckVersions check_versions = 13;
    UnwatchSession unwatch_session = 14;
    ReadMessageReply read_message_reply = 15;
    GetHostCapabilities get_host_capabilities = 190;
    ListModels list_models = 200;
    ReadSessionModel read_session_model = 201;
    SelectSessionModel select_session_model = 202;
    WaitSession wait_session = 220;
    CancelSessionWait cancel_session_wait = 221;
    ReadWaitState read_wait_state = 222;
    CreateSession create_session = 240;
    ReadPendingQueue read_pending_queue = 280;
    UpdatePendingQueue update_pending_queue = 281;
    ListQuestions list_questions = 260;
    GetQuestion get_question = 261;
    AnswerQuestion answer_question = 262;
    CancelQuestionAnswer cancel_question_answer = 263;
    ForkSession fork_session = 300;
    // Authorized attachment reads over the existing encrypted query path.
    OpenAttachment open_attachment = 320;
    PullAttachment pull_attachment = 321;
    CloseAttachment close_attachment = 322;
  }
}

message ResponsePayload {
  oneof payload {
    SessionList session_list = 1;


    Approval approval = 4;
    CommandAccepted command_accepted = 5;
    CommandResult command_result = 6;
    Pong pong = 7;
    ApprovalList approval_list = 10;
    HistoryPage history_page = 11;
    WatchReady watch_ready = 12;
    VersionChecks version_checks = 13;
    SessionSummary session_info = 14;
    MessageReply message_reply = 15;
    HostCapabilities host_capabilities = 190;
    ModelCatalog model_catalog = 200;
    SessionModel session_model = 201;
    ModelSelectionReceipt model_selection_receipt = 202;
    SessionWaitResult session_wait_result = 220;
    SessionWaitStateResult session_wait_state_result = 221;
    LifecycleReceipt lifecycle_receipt = 240;
    PendingQueue pending_queue = 280;
    QuestionPage question_page = 260;
    QuestionBatch question_batch = 261;
    QuestionReceipt question_receipt = 262;
    QuestionCancelReceipt question_cancel_receipt = 263;
    // Attachment read results; bytes never travel in conversation events or
    // history.
    OpenAttachmentResult open_attachment_result = 320;
    AttachmentPart attachment_part = 321;
    CloseAttachmentResult close_attachment_result = 322;
  }
  // Domain failure. HostResult.status carries the online status copy.
  ErrorCode error_code = 8;
  string error_detail = 9;
}

// Model selection values are owned by the source, never cached as authority.
message GetHostCapabilities {}
message HostCapabilities { bool model_catalog = 200; bool model_read = 201; bool session_create = 240; bool session_fork = 300; }
message ListModels {}
message ReadSessionModel { string session_id = 1; }
message ModelChoice { string provider = 1; string model = 2; optional string effort = 3; }
message ModelEffort { string id = 1; string name = 2; }
message ModelEntry { string id = 1; string name = 2; repeated ModelEffort efforts = 3; string default_effort = 4; }
message ModelProvider { string id = 1; string name = 2; repeated ModelEntry models = 3; }
message ModelProviderFailure { string id = 1; string name = 2; ErrorCode code = 3; }
message ModelCatalog { ModelChoice default_selection = 1; repeated ModelProvider groups = 2; repeated ModelProviderFailure failures = 3; string effect_scope = 4; bool complete = 5; }
message SessionModel { ModelChoice pending = 1; ModelChoice last_used = 2; ModelChoice default_selection = 3; bool default_is_fallback = 4; ModelChoice next = 5; bool pending_known = 6; }
message SelectSessionModel { string session_id = 1; string provider = 2; string model = 3; optional string effort = 4; }
message ModelSelectionReceipt { ModelChoice selected = 1; string effect_scope = 2; string default_persistence = 3; }

message ForkSession { string session_id = 1; }
message CreateSession {
  optional string cwd = 1;
  optional string workspace_id = 2;
  optional string agent_preset = 3;
  optional string preferred_session_id = 4;
}
enum LifecycleDisposition {
  LIFECYCLE_DISPOSITION_UNSPECIFIED = 0;
  READY = 1;
  READY_WITH_WARNING = 2;
  // Proven failure before any native effect.
  FAILED = 3;
  // A native effect may have happened; the outcome needs reconciliation.
  UNKNOWN = 4;
}
message LifecycleReceipt {
  string session_id = 1;
  string operation = 2;
  LifecycleDisposition disposition = 3;
  string warning_code = 4;
  string parent_session_id = 5;
  // Stable operation identity, independent of the command journal row.
  string operation_id = 6;
  // Coarse phase: PREFLIGHT, NATIVE, ATTACH, PERSIST, or COMPLETE.
  string phase = 7;
  // Stable reason code for FAILED and UNKNOWN outcomes.
  string reason_code = 8;
  bool retryable = 9;
  // OPERATION_ID, PREFERRED_SESSION_ID, PARENT_SESSION_ID, or MANUAL.
  string reconcile_mode = 10;
  string reconcile_key = 11;
  // Bounded, redacted warning text; never contains native error details.
  optional string warning_detail = 12;
}

message ListSessions {}

// Question contents are source-owned and transmitted only within the encrypted
// session. A projection may be discoverable without an answerable live handle.
enum QuestionPhase {
  QUESTION_PHASE_UNSPECIFIED = 0;
  QUESTION_OPEN = 1;
  QUESTION_CONTINUED = 2;
  QUESTION_REPLY_QUEUED = 3;
  QUESTION_SETTLED = 4;
}
message QuestionOption { string label = 1; optional string description = 2; }
message QuestionLocalizedText { map<string, string> translations = 1; }
message QuestionSubject { string name = 1; optional string icon = 2; }
message QuestionDisplay {
  QuestionLocalizedText question = 1;
  QuestionLocalizedText detail = 2;
  QuestionLocalizedText approve = 3;
}
message QuestionIntent {
  string kind = 1;
  string approve = 2;
  optional string reject = 3;
  optional string always = 4;
  optional string call_id = 5;
  QuestionSubject subject = 6;
  QuestionDisplay display = 7;
}
message QuestionItem {
  string id = 1;
  string question = 2;
  optional string detail = 3;
  optional string header = 4;
  repeated QuestionOption options = 5;
  bool multi_select = 6;
  QuestionIntent intent = 7;
}
message QuestionAnswerItem {
  string id = 1;
  repeated string selected = 2;
  optional string custom = 3;
}
// A source observation epoch plus a monotonic revision of the normalized
// pending-question inventory. Reading or refreshing unchanged inventory does
// not advance it. The stamp certifies a collection; it is not answer authority.
message QuestionStamp {
  string observation_epoch = 1;
  uint64 revision = 2;
}
message QuestionDescriptor {
  QuestionAvailability availability = 1;
  // Stable failure code for unavailable/unsupported questions, empty when
  // available.
  string unavailable_code = 2;
  // Present exactly when availability is available.
  QuestionStamp stamp = 3;
}
message QuestionBatch {
  string session_id = 1;
  string batch_id = 2;
  string source_epoch = 3;
  uint64 version = 4;
  bytes digest = 5;
  QuestionPhase phase = 6;
  repeated QuestionItem questions = 7;
  bool answerable = 8;
  bool content_unavailable = 9;
}
message ListQuestions { string session_id = 1; string cursor = 2; }
message GetQuestion { string session_id = 1; string batch_id = 2; }
message QuestionPage {
  repeated QuestionBatch batches = 1;
  string next_cursor = 2;
  // Stamp of the complete inventory from which this page was derived. Every
  // page of one observation must carry the identical stamp.
  QuestionStamp stamp = 3;
  // True only on the final page of that same stamped inventory.
  bool complete = 4;
}
message AnswerQuestion {
  string session_id = 1;
  string batch_id = 2;
  string source_epoch = 3;
  uint64 expected_version = 4;
  bytes expected_digest = 5;
  QuestionPhase expected_phase = 6;
  repeated QuestionAnswerItem answers = 7;
}
message QuestionReceipt { string batch_id = 1; QuestionPhase phase = 2; }

// Cancels only an in-flight open answer belonging to this authenticated device.
// False means there was no matching active operation; it proves no outcome.
message CancelQuestionAnswer { string session_id = 1; string command_id = 2; }
message QuestionCancelReceipt { bool cancellation_requested = 1; }

message GetSession {
  string session_id = 1;
}



message GetApproval {
  string approval_id = 1;
}

message ListApprovals {
  // Optional session filter. Empty lists every pending approval known to the
  // host.
  string session_id = 1;
}

message ApprovalList {
  repeated Approval approvals = 1;
}

message GetCommandResult {
  string command_id = 1;
}

message SendMessage {
  string session_id = 1;
  string text = 2;
  DeliveryMode delivery_mode = 3;
}

message Interrupt {
  string session_id = 1;
}

message ResolveApproval {
  string approval_id = 1;
  ApprovalDecision decision = 2;
  bytes expected_digest = 3;
  int64 expected_version = 4;
}

message Ping {
  int64 client_time_unix_ms = 1;
}

message Pong {
  int64 host_time_unix_ms = 1;
}

message SessionSummary {
  string session_id = 1;
  string title = 2;
  string cwd = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
  bool running = 6;
  bool agent_available = 7;
  bool blank = 8;
  string parent_session_id = 9;
  string origin = 10;
  uint32 queued_prompts = 12;
  string history_cursor = 13;
  SourceCapabilities source_capabilities = 14;
  bool archived = 11;
}

message SessionList {
  repeated SessionSummary sessions = 1;
}







message CommandAccepted {
  string message_id = 1;
  // Opaque identity of the accepted delivery; not a committed message ID.
  string delivery_id = 180;
}

message CommandResult {
  bool found = 1;
  OnlineStatus status = 2;
  // Serialized ResponsePayload of the original terminal command result.
  bytes result_payload = 3;
  ErrorCode error_code = 4;
}

message Approval {
  string approval_id = 1;
  string session_id = 2;
  string tool_name = 3;
  string call_id = 4;
  string reason = 5;
  // SHA-256 over the canonical approval fields, including version and expiry.
  bytes digest = 6;
  int64 version = 7;
  int64 expires_at_unix_ms = 8;
  ApprovalState state = 9;
  ApprovalDecision decision = 10;
  // Bounded, credential-masked review facts projected by the Host from the
  // live native request. Only a device with current approval rights receives
  // them, and they are bound by the canonical approval digest. Raw tool
  // arguments never travel and must never be reconstructed from these values.
  string review_action = 11;
  string review_target = 12;
  string review_impact = 13;
  ApprovalReviewAvailability review_availability = 14;
}

// ---------------------------------------------------------------------------
// Event envelope (MQTT)
// ---------------------------------------------------------------------------

message EventEnvelope {
  string host_id = 1;
  string device_id = 2;
  string channel_id = 3;
  // `nonce` is always present; it is framing metadata, not stored content.
  // Exactly one of `ciphertext` and `payload_reference` is then set. Access may
  // rewrite the same exact ciphertext into payload_reference for the Device
  // hop while preserving the nonce and event identity.
  bytes nonce = 4;
  bytes ciphertext = 5;
  int64 created_at_unix_ms = 6;
  string trace_id = 7;
  // Required relay epoch; must equal RELAY_EPOCH_V5 (5).
  uint32 relay_version = 8;
  // Complete ciphertext locator. Exactly one of `ciphertext` and
  // `payload_reference` is set; the reference resolves to the same ciphertext
  // under the same event identity and `nonce`.
  PayloadReference payload_reference = 9;
}

// Encrypted event plaintext.
message EventPayload {
  SessionUpdate update = 1;
  // A Host-authored terminal end of one observation. Access cannot author this
  // frame because the stream is end-to-end encrypted; the Host sends it when
  // the source no longer has the session.
  WatchClosed watch_closed = 2;
}

// Host-side terminal close. reason is a stable string; a client treats every
// non-empty reason as terminal and never reconnects.
message WatchClosed {
  string watch_id = 1;
  SessionKey session = 2;
  string reason = 3;
}

// Normalized conversation domain. Sources interpret native identifiers; clients
// never decode their payload shapes or compare history cursors numerically.
message SessionKey { string host_id = 1; string session_id = 2; }
message SourceCapabilities {
  bool history = 1; bool resumable_history = 2; bool live_text = 3;
  bool interrupt = 4; bool approvals = 5;
  repeated DeliveryMode delivery_modes = 6;
  // Optional expanded conversation capabilities. Absent means unsupported and
  // must be reported explicitly rather than simulated.
  bool live_reasoning = 7;
  bool tool_activity = 8;
  bool conversation_notices = 9;
  bool attachments = 10;
  bool history_page = 11;
  bool history_exact = 12;
  bool send_followup = 13;
  bool model_selection = 200;
  bool pending_queue_read = 280; bool pending_queue_edit = 281;
  bool pending_queue_remove = 282; bool pending_queue_steer = 283;
  bool questions_read = 260;
  bool questions_answer_open = 261;
  bool questions_answer_continued = 262;
  bool session_fork = 300;
}
enum DeliveryMode { DELIVERY_MODE_UNSPECIFIED = 0; START_IF_IDLE = 1; ENQUEUE_AFTER_RUN = 2; STEER = 3; }
// Committed authorship. UNSPECIFIED is invalid for a committed Message: a
// missing or unknown native classification must be normalized to UNKNOWN so a
// context body is never projected into the user lane.
enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  USER = 1;
  ASSISTANT = 2;
  TOOL = 3;
  NOTICE = 4;
  // Recognized Source-generated context. It projects only a safe notice or
  // omission and never a user body.
  MESSAGE_ROLE_CONTEXT = 5;
  // Missing, unrecognized or unmapped authorship. It projects only a safe
  // omission and never a user body.
  MESSAGE_ROLE_UNKNOWN = 6;
}
enum RunPhase { RUN_PHASE_UNSPECIFIED = 0; IDLE = 1; RUNNING = 2; STOPPING = 3; SOURCE_UNAVAILABLE = 4; }
enum AttemptOutcome { ATTEMPT_OUTCOME_UNSPECIFIED = 0; COMMITTED = 1; ABANDONED = 2; INTERRUPTED = 3; ATTEMPT_FAILED = 4; }
message AttemptRef { string live_epoch = 1; string attempt_id = 2; }
message TextContent { string text = 1; }
// Displayable reasoning content. It is ordered alongside text blocks and keeps
// the same committed block identity; a reasoning-disabled model emits none.
message ReasoningContent { string text = 1; }
// The checked kind of a live block. Delta append and full replacement carry
// this kind so a reader never merges reasoning into an answer block or the
// reverse.
enum BlockKind {
  BLOCK_KIND_UNSPECIFIED = 0;
  BLOCK_KIND_TEXT = 1;
  BLOCK_KIND_REASONING = 2;
}
message LiveBlockDelta { BlockKind kind = 1; string text = 2; }
message LiveBlockReset { BlockKind kind = 1; string text = 2; }
// Evidenced stages of one Source tool call, in ascending order. A stage is
// present only when the adapter can prove it happened.
enum ToolStage {
  TOOL_STAGE_UNSPECIFIED = 0;
  TOOL_STAGE_PREPARATION = 1;
  TOOL_STAGE_EXECUTION = 2;
  TOOL_STAGE_PROGRESS = 3;
  TOOL_STAGE_SETTLEMENT = 4;
}
enum ToolOutcome {
  TOOL_OUTCOME_UNSPECIFIED = 0;
  TOOL_OUTCOME_SUCCEEDED = 1;
  TOOL_OUTCOME_FAILED = 2;
  TOOL_OUTCOME_INTERRUPTED = 3;
  TOOL_OUTCOME_UNKNOWN = 4;
}
// Ordered displayable result content for a tool activity. Attachments carry
// only an opaque occurrence reference, never bytes.
message ToolResultPart {
  oneof content { TextContent text = 1; AttachmentContent attachment = 2; }
}
// One Source tool call activity. call_id is stable and session-scoped across
// live updates, committed history and combined history pages; Core merges
// repeated occurrences by that identity without native correlation.
message ToolActivity {
  string call_id = 1;
  repeated ToolStage stages = 2;
  // Display-safe tool name.
  string name = 3;
  // Optional display-safe label or summary. Never raw arguments.
  optional string summary = 4;
  repeated ToolResultPart result = 5;
  ToolOutcome outcome = 6;
  // Optional display-safe progress summary; never raw arguments or output.
  optional string progress = 7;
  // Stable display-safe failure code when outcome is FAILED.
  optional string failure_code = 8;
}
// Stable Source notice categories. The notice occupies its ordered block
// position in the committed Message or live block sequence.
enum NoticeCategory {
  NOTICE_CATEGORY_UNSPECIFIED = 0;
  NOTICE_CATEGORY_RETRY = 1;
  NOTICE_CATEGORY_MAX_OUTPUT = 2;
  NOTICE_CATEGORY_COMPACTION = 3;
  NOTICE_CATEGORY_COMMAND = 4;
  NOTICE_CATEGORY_CONTEXT = 5;
  NOTICE_CATEGORY_OMISSION = 6;
}
// Known Source state. A state is present only when the Source established it.
enum NoticeState {
  NOTICE_STATE_UNSPECIFIED = 0;
  NOTICE_STATE_SCHEDULED = 1;
  NOTICE_STATE_STARTED = 2;
  NOTICE_STATE_CANCELLED = 3;
  NOTICE_STATE_COMPLETED = 4;
  NOTICE_STATE_FAILED = 5;
  NOTICE_STATE_REACHED = 6;
}
message NoticeContent {
  NoticeCategory category = 1;
  NoticeState state = 2;
  // Optional Source-approved display summary. Never raw command arguments or
  // compaction input.
  optional string summary = 3;
}
message AttachmentContent {
  string media_type = 1;
  string name = 2;
  uint64 size = 3;
  bool available = 4;
  // Opaque Source occurrence reference scoped to the committed session. It
  // never carries bytes; a read requires the attachment query family.
  string attachment_ref = 5;
}
message ContentBlock {
  string block_id = 1;
  // Tags 3 and 4 are the retired tool_call/tool_result shapes. They stay
  // reserved so an old peer skips an unknown field instead of silently
  // decoding the old message type; tool_activity uses a fresh tag.
  reserved 3, 4;
  reserved "tool_call", "tool_result";
  oneof content {
    TextContent text = 2;
    ToolActivity tool_activity = 8;
    NoticeContent notice = 5;
    AttachmentContent attachment = 6;
    ReasoningContent reasoning = 7;
  }
}
message ConversationMessage {
  string message_id = 1;
  MessageRole role = 2;
  repeated ContentBlock blocks = 3;
  int64 authored_at_unix_ms = 4;
  // Source-assigned delivery correlation for a committed user message.
  string delivery_id = 5;
}
message MessageUpsert { ConversationMessage message = 1; AttemptRef origin = 2; }
message HistoryBatch {
  string from_cursor = 1; string to_cursor = 2; string batch_id = 3;
  repeated MessageUpsert changes = 4;
  // Content projection identity; cursor and batch namespaces are bound to it.
  string projection_id = 5;
}
// Latest-first bounded page selection. Mutually exclusive with after_cursor,
// exact and continuation.
message HistoryPageSelection {
  // Opaque position to start before. Empty starts at the most recent committed
  // message at the fixed cut. Pages step toward older history.
  string before_cursor = 1;
}
enum HistorySource {
  HISTORY_SOURCE_UNSPECIFIED = 0;
  HISTORY_SOURCE_ONLINE = 1;
  HISTORY_SOURCE_CACHE = 2;
}
// Scoped canonical committed-message reference. The locator is opaque Source
// evidence; the projection identity fences stale reads.
message CommittedMessageRef {
  SessionKey session = 1;
  string message_id = 2;
  string source_locator = 3;
  string projection_id = 4;
}
message HistoryRead {
  string session_id = 1;
  bool snapshot = 2;
  // Forward traversal for synchronization. Mutually exclusive with page, exact
  // and continuation. Empty means the origin for a forward read.
  string after_cursor = 3;
  string cut_cursor = 4;
  uint32 max_bytes = 5;
  uint32 max_messages = 6;
  HistoryPageSelection page = 7;
  CommittedMessageRef exact = 8;
  // Core-owned opaque continuation returned by a previous page. It binds the
  // validated scope, projection, fixed cut, next position and read source.
  // Mutually exclusive with after_cursor, page and exact.
  string continuation = 9;
  // Requested source. UNSPECIFIED means online; CACHE is served locally by
  // Core with the same selection semantics and never sent to a Host.
  HistorySource source = 10;
}
message HistoryPage {
  SessionKey session = 1; HistoryBatch batch = 2;
  string cut_cursor = 3; bool complete = 4; bool snapshot = 5;
  // Core-owned opaque continuation for the next page in the same direction.
  // Empty means no further page exists at this fixed cut.
  string continuation = 6;
  // Active content projection identity for this page.
  string projection_id = 7;
  HistorySource source = 8;
}
// ---------------------------------------------------------------------------
// Authorized attachment reads
//
// These payloads travel inside the existing encrypted query/result path. Bytes
// never appear in conversation events, history pages or the transcript cache.
// Every request is scoped to the authenticated device, Host, session, channel
// and occurrence; a transfer handle is also bound to those values.
// ---------------------------------------------------------------------------

message AttachmentPolicy {
  // Effective total bytes allowed for one attachment read.
  uint64 max_total_bytes = 1;
  // Effective bound for one part payload.
  uint32 max_chunk_bytes = 2;
  // Active transfer slots allowed for one device/channel.
  uint32 max_concurrent = 3;
  uint32 idle_timeout_ms = 4;
  uint32 overall_timeout_ms = 5;
}

message AttachmentMetadata {
  SessionKey session = 1;
  string attachment_ref = 2;
  string media_type = 3;
  // Display suggestion only; the client validates a safe local filename.
  string name = 4;
  // Authoritative declared size before any byte is read.
  uint64 size = 5;
  AttachmentPolicy policy = 6;
  // Short-lived opaque transfer handle.
  string transfer_id = 7;
  int64 expires_at_unix_ms = 8;
}

message OpenAttachment {
  SessionKey session = 1;
  string attachment_ref = 2;
}
message OpenAttachmentResult { AttachmentMetadata attachment = 1; }

message PullAttachment {
  SessionKey session = 1;
  string attachment_ref = 2;
  string transfer_id = 3;
  // Contiguous next offset. A duplicate of the last completed offset is the
  // only allowed idempotent retry; any other gap or overlap is rejected.
  uint64 offset = 4;
  // Bounded request; the Host returns at most the effective chunk budget.
  uint32 max_bytes = 5;
}

message AttachmentPart {
  SessionKey session = 1;
  string attachment_ref = 2;
  string transfer_id = 3;
  uint64 offset = 4;
  // Declared payload length; must equal data length.
  uint32 length = 5;
  bytes data = 6;
  bool final = 7;
  // Terminal integrity metadata. Required when final is true; ignored before
  // that point.
  uint64 total_size = 8;
  bytes sha256 = 9;
}

message CloseAttachment {
  SessionKey session = 1;
  string attachment_ref = 2;
  string transfer_id = 3;
  // True cancels and disposes the transfer; false closes a completed one.
  bool cancel = 4;
}
message CloseAttachmentResult {
  bool closed = 1;
  bool cancelled = 2;
}

// Resolve committed Source evidence for a single submitted message.
message ReadMessageReply { string session_id = 1; string submitted_message_id = 2; }
enum MessageReplyState {
  MESSAGE_REPLY_STATE_UNSPECIFIED = 0;
  MESSAGE_REPLY_PENDING = 1;
  MESSAGE_REPLY_COMMITTED = 2;
  MESSAGE_REPLY_INPUT_REQUIRED = 3;
  MESSAGE_REPLY_UNCERTAIN = 4;
}
message MessageReply {
  string session_id = 1;
  string submitted_message_id = 2;
  MessageReplyState state = 3;
  reserved 4, 5;
  reserved "attempt_id", "text";
  // Present exactly for COMMITTED. Bodies stay in history.
  CommittedMessageRef committed = 6;
  // Present exactly for INPUT_REQUIRED; the same vocabulary as WaitSession.
  repeated InputKind pending_input = 7;
}
message AttemptStarted {}
message AttemptEnded { AttemptOutcome outcome = 1; }
message LiveFrame {
  AttemptRef attempt = 1; string block_id = 2; uint64 first_seq = 3; uint64 last_seq = 4;
  oneof payload { AttemptStarted started = 5; LiveBlockDelta delta = 6;
    LiveBlockReset reset = 7; AttemptEnded ended = 8; }
}
message SessionState {
  SessionKey session = 1; string live_epoch = 2; uint64 revision = 3;
  string history_head = 4; RunPhase run_phase = 5;
  // Pending approvals are content: they travel only through the bounded
  // ApprovalList query, never inside a session state. Their former field
  // number is reserved so a stale writer cannot reappear as a compatible
  // baseline.
  reserved 6;
  reserved "approvals";
  // Questions readiness is independent of history readiness. A questions-only
  // observation may omit history_head and run_phase.
  QuestionDescriptor questions = 7;
  // Content projection identity; state and live positions are bound to it.
  string projection_id = 8;
}
message HistoryReset { string reason = 1; }
message SessionUpdate {
  string watch_id = 1; SessionKey session = 2;
  oneof payload { HistoryBatch history = 3; LiveFrame live = 4;
    SessionState state = 5; HistoryReset reset = 6;
    // Independent question invalidations, delivered without waiting for or
    // replacing conversation state.
    QuestionDescriptor questions = 7; }
}
message ObservationInterests { bool conversation = 1; bool questions = 2; }
message WatchSession { string session_id = 1; ObservationInterests interests = 2; }
message WatchReady {
  string watch_id = 1;
  // Conversation baseline; absent for a questions-only observation.
  SessionState state = 2;
  uint32 lease_ms = 3;
  // Question readiness for this observation. Required for questions interest.
  QuestionDescriptor questions = 4;
}
// Bounded, read-only reconciliation of authoritative DSH state for one active
// observation. It never renews or extends a watch lease; authorization and the
// observation generation travel in the enclosing query and authenticated
// connection.
message CheckVersions { string session_id = 1; }
// Authoritative version markers for one observation. Content stays on the
// event stream and the paged history read; a changed marker means the observer
// missed something, and the affected facet is rebuilt through the existing
// authoritative reads.
message VersionCheck {
  string watch_id = 1;
  uint64 revision = 2;
  RunPhase run_phase = 3;
  string live_epoch = 4;
  string history_head = 5;
  string projection_id = 6;
  QuestionDescriptor questions = 7;
}
message VersionChecks { repeated VersionCheck checks = 1; }
message UnwatchSession { string watch_id = 1; }

// Ephemeral, read-only observations. The enclosing request owns authorization
// and expiry; wait_id is scoped to its device, channel, and session.
message WaitSession { string session_id = 1; string wait_id = 2; uint32 timeout_ms = 3; }
message CancelSessionWait { string session_id = 1; string wait_id = 2; }
message ReadWaitState { string session_id = 1; }
enum WaitReason { WAIT_REASON_UNSPECIFIED = 0; WAIT_IDLE = 1; WAIT_INPUT_REQUIRED = 2; WAIT_TIMEOUT = 3; }
enum InputKind { INPUT_KIND_UNSPECIFIED = 0; INPUT_APPROVAL = 1; INPUT_QUESTION = 2; INPUT_OTHER = 3; }
message SessionWaitState {
  bool active = 1;
  bool running = 2;
  bool queue_available = 3;
  repeated InputKind pending_input = 4;
}
message SessionWaitResult {
  string session_id = 1;
  string wait_id = 2;
  WaitReason reason = 3;
  SessionWaitState state = 4;
}
message SessionWaitStateResult { string session_id = 1; SessionWaitState state = 2; }
// Pending work remains owned by the source and is never persisted as history.
message ReadPendingQueue { string session_id = 1; }
enum QueuePlacement { QUEUE_PLACEMENT_UNSPECIFIED = 0; QUEUED = 1; STEERING = 2; CONTEXT = 3; }
enum QueueAction { QUEUE_ACTION_UNSPECIFIED = 0; EDIT = 1; REMOVE = 2; PROMOTE = 3; }
message PendingQueueItem {
  string item_id = 1; QueuePlacement placement = 2; string delivery_id = 3;
  repeated ContentBlock blocks = 4; repeated QueueAction actions = 5;
}
message PendingQueue {
  string session_id = 1; bool available = 2; bool running = 3;
  repeated PendingQueueItem items = 4;
}
message UpdatePendingQueue {
  string session_id = 1; string item_id = 2; QueueAction action = 3;
  // Text replaces the complete prior item content, including attachments.
  string text = 4;
}

// ---------------------------------------------------------------------------
// Independent Access nodes (contract v1)
//
// These messages describe the authenticated control plane between Central and
// one Access node, and the route view Central gives endpoints. They never carry
// conversation content, request bodies or temporary ciphertext. A node
// heartbeat reports metadata only; a Host route is the single placement fact.
// ---------------------------------------------------------------------------

enum RouteState {
  ROUTE_STATE_UNSPECIFIED = 0;
  ROUTE_OPEN = 1;
  ROUTE_CLOSED = 2;
}

// An Access node incarnation. A replacement disk or a restored process gets a
// fresh incarnation bounded to its registered node credential; a retired
// incarnation can never report itself live again.
message NodeIdentity {
  string node_id = 1;
  string incarnation = 2;
  string region_id = 3;
  string https_url = 4;
  string mqtt_url = 5;
  // Advertised capacity in whole Host slots. Zero means no new placements.
  uint32 capacity = 6;
  int64 registered_at_unix_ms = 7;
}

// Access -> Central every ten seconds on the authenticated node connection.
message NodeReport {
  string node_id = 1;
  string incarnation = 2;
  // Strictly increasing per incarnation. A duplicate or stale sequence is
  // ignored for health and never refreshes last observed.
  uint64 sequence = 3;
  bool ready = 4;
  uint32 capacity = 5;
  uint32 host_count = 6;
  // Policy revisions installed from Central. Content-free.
  repeated string applied_policy_revisions = 7;
  int64 observed_at_unix_ms = 8;
}

message NodeReportAck {
  // Central receipt time. Health is derived from this time, never the node
  // supplied observation time.
  int64 received_at_unix_ms = 1;
  bool placement_eligible = 2;
  string rejection_reason = 3;
}

// Host -> Access -> Central. The Host signs service, environment, Host, node,
// incarnation, generation, a fresh attach challenge and its pinned keys.
message HostRouteAttach {
  string host_id = 1;
  string workspace_id = 2;
  string service = 3;
  string environment = 4;
  string node_id = 5;
  string incarnation = 6;
  uint64 generation = 7;
  string challenge = 8;
  int64 signed_at_unix_ms = 9;
  bytes host_signature = 10;
  bytes host_signing_public_key = 11;
  bytes host_noise_public_key = 12;
  // True only when the node observed an authenticated Host transport.
  bool node_observed = 13;
  string node_incarnation = 14;
}

message HostRoute {
  string host_id = 1;
  string workspace_id = 2;
  string node_id = 3;
  string incarnation = 4;
  uint64 generation = 5;
  RouteState state = 6;
  string challenge = 7;
  int64 updated_at_unix_ms = 8;
}

enum RouteOutcome {
  ROUTE_OUTCOME_UNSPECIFIED = 0;
  ROUTE_COMMITTED = 1;
  ROUTE_IDEMPOTENT = 2;
  ROUTE_STALE = 3;
  ROUTE_CONFLICT = 4;
  ROUTE_REFUSED = 5;
}

message HostRouteAttachReceipt {
  RouteOutcome outcome = 1;
  HostRoute route = 2;
  ErrorCode error_code = 3;
  string reason = 4;
}

// A proved close. A close for a generation at or above the stored high-water
// mark is persisted as closed even when its attach has not arrived. A lower
// generation is stale and cannot mutate the row. `host_signature` is required
// for a generation above the high-water mark; an equal admitted tuple may be
// closed by the named node alone.
message HostRouteClose {
  string host_id = 1;
  string node_id = 2;
  string incarnation = 3;
  uint64 generation = 4;
  int64 signed_at_unix_ms = 5;
  bytes host_signature = 6;
  bytes host_signing_public_key = 7;
  string challenge = 8;
  string service = 9;
  string environment = 10;
}

message HostRouteCloseReceipt {
  RouteOutcome outcome = 1;
  HostRoute route = 2;
  ErrorCode error_code = 3;
  string reason = 4;
}

// Access -> Central inventory after reconnect or restart. Central compares the
// reported tuples with its durable routes and returns the authoritative state.
// Inventory can close a matching route; it can never create or reopen one.
message NodeInventory {
  string node_id = 1;
  string incarnation = 2;
  uint64 sequence = 3;
  repeated HostRoute routes = 4;
}

// Operator-visible drain state for one serving incarnation. A drained node is
// never advertised for new placements; established routes remain readable.
message NodeDrain {
  string node_id = 1;
  string incarnation = 2;
  bool drained = 3;
}

message NodeInventoryAck {
  repeated HostRoute routes = 1;
  uint64 inventory_sequence = 2;
}

// Central -> endpoint directory answer. A Device follows its Host's node; a
// Host asks for eligible placement candidates. Freshness is Central receipt
// time, and only an open route is advertised.
message RouteDiscovery {
  string host_id = 1;
  HostRoute route = 2;
  string https_url = 3;
  string mqtt_url = 4;
  bool fresh = 5;
  int64 observed_at_unix_ms = 6;
  // Reasons are stable machine values, never content.
  string unavailable_reason = 7;
}

// Central-signed authority for one managed scope. The lifetime is at most
// sixty seconds from Central confirmation. The same message authorizes a
// command, a result read, an attachment read and a live observation, because
// every protected path checks the same immutable scope and absolute deadline.
message ScopedAuthority {
  string auth_version = 1;
  string authority_id = 2;
  string issuer = 3;
  string audience = 4;
  string environment = 5;
  string workspace_id = 6;
  string host_id = 7;
  string device_id = 8;
  string session_id = 9;
  uint64 grant_generation = 10;
  uint64 host_grant_generation = 11;
  string serving_node_id = 12;
  uint64 route_generation = 13;
  // App-session proof key bound at session creation. It is immutable for the
  // session and never replaced by a renewal.
  bytes session_proof_public_key = 14;
  string policy_revision = 15;
  int64 issued_at_unix_ms = 16;
  int64 expires_at_unix_ms = 17;
  string key_id = 18;
  bytes signature = 19;
}

// Access -> Central renewal request. Access batches this with its heartbeat.
message AuthorityRenewalRequest {
  string host_id = 1;
  string device_id = 2;
  string session_id = 3;
  uint64 grant_generation = 4;
  uint64 route_generation = 5;
  string node_id = 6;
  string incarnation = 7;
  repeated string current_authority_ids = 8;
  string environment = 9;
  // The App-session proof public key Access holds. Central refuses a
  // replacement; the binding is immutable for the session.
  bytes session_proof_public_key = 10;
  uint64 host_grant_generation = 11;
}

message AuthorityRenewalResponse {
  ScopedAuthority authority = 1;
  // The greatest absolute deadline Central has ever committed for this exact
  // scope. It never decreases across nodes, routes or restarts while the
  // scope is outstanding.
  int64 maximum_expires_at_unix_ms = 2;
  ErrorCode error_code = 3;
  string reason = 4;
}

message AuthorityAcknowledgement {
  string node_id = 1;
  string incarnation = 2;
  repeated string authority_ids = 3;
  string applied_policy_revision = 4;
  int64 applied_at_unix_ms = 5;
}

enum RevocationState {
  REVOCATION_STATE_UNSPECIFIED = 0;
  REVOCATION_PENDING_ENFORCEMENT = 1;
  REVOCATION_EFFECTIVE = 2;
}

// Content-free enforcement report. Acknowledgements record delivery progress
// only; `effective` is derived from the frozen maximum affected deadline, not
// from an acknowledgement.
message RevocationStatus {
  string scope_type = 1;
  string scope_id = 2;
  uint64 revision = 3;
  int64 frozen_expires_at_unix_ms = 4;
  RevocationState state = 5;
  int64 recorded_at_unix_ms = 6;
}

// ---------------------------------------------------------------------------
// External account mode (contract v1, ratified 2026-11-14)
//
// Standalone mode never sends these messages. An endpoint carries a portable
// authorization minted by the selected account service, and Access verifies
// it locally before admitting an enrollment or pairing.
// ---------------------------------------------------------------------------

// A short-lived, purpose-bound authorization. The signature is Ed25519 over
// the canonical text form; no JSON is signed.
message ExternalAuthorization {
  string auth_version = 1;
  string authorization_id = 2;
  string issuer = 3;
  string audience = 4;
  string purpose = 5;
  string workspace_id = 6;
  string region_id = 7;
  string operation_id = 8;
  string enrollment_revision = 9;
  string precondition = 10;
  string expected_revision = 11;
  string host_id = 12;
  repeated bytes host_public_keys = 13;
  string device_id = 14;
  repeated bytes device_public_keys = 15;
  int64 issued_at_unix_ms = 16;
  int64 expires_at_unix_ms = 17;
  bytes nonce = 18;
  string key_id = 19;
  bytes signature = 20;
  // App-session proof public key bound at Cloud session creation. Access stores
  // it for authority requests; Host compares it with the permit.
  bytes session_proof_public_key = 21;
}

// The Host proves possession of the approved signing key by signing the
// enrollment proof input; Access compares the proven key with the assertion.
message HostEnrollmentRequest {
  ExternalAuthorization authorization = 1;
  string operation_id = 2;
  string host_id = 3;
  bytes host_signing_public_key = 4;
  bytes host_noise_public_key = 5;
  bytes proof_signature = 6;
}

// Broker credentials are issued once, on the call that commits the enrollment.
message HostCredential {
  string host_id = 1;
  string mqtt_url = 2;
  string username = 3;
  string password = 4;
  // The serving node identity. The Host signs its route attachment with these
  // values so Central can bind the proof to the actual node connection.
  string node_id = 5;
  string incarnation = 6;
  // Issuer key for Central-signed App-session permits. The Host verifies every
  // delivered ScopedAuthority independently with this key.
  bytes authority_public_key = 7;
}

enum EnrollmentState {
  ENROLLMENT_STATE_UNSPECIFIED = 0;
  // Recorded and waiting for readiness to be observed.
  enrollment_pending = 1;
  enrollment_ready = 2;
  enrollment_disabled = 3;
}

message HostEnrollmentStatus {
  string host_id = 1;
  string workspace_id = 2;
  string enrollment_revision = 3;
  EnrollmentState state = 4;
  string operation_id = 5;
  bytes host_signing_public_key = 6;
  bytes host_noise_public_key = 7;
  // The credential issuance recorded beside the broker credential hash. A
  // legacy enrollment that never recorded one keeps both fields empty/zero.
  string current_credential_operation_id = 8;
  uint64 credential_generation = 9;
  // Additive removal lifecycle: none, pending, enforced or disabled (a
  // disabled enrollment without a recorded removal operation).
  string removal_state = 10;
  string removal_operation_id = 11;
  int64 removal_enforced_at_unix_ms = 12;
}

message HostEnrollmentResponse {
  HostEnrollmentStatus status = 1;
  // Present only on the response that commits the enrollment.
  HostCredential credential = 2;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  operation_pending = 1;
  operation_committed = 2;
  operation_conflict = 3;
  operation_refused = 4;
}

message OperationStatus {
  string operation_id = 1;
  string purpose = 2;
  OperationState state = 3;
  string workspace_id = 4;
  string host_id = 5;
  string enrollment_revision = 6;
  string authorization_id = 7;
  bytes payload_digest = 8;
  int64 committed_at_unix_ms = 9;
  // Authoritative admission outcome: admitted, committed, refused, expired,
  // fenced, absent or pending. A legacy row without an outcome reports pending
  // and keeps its stored state.
  string outcome = 10;
  // Stable machine reason for a refused/expired/fenced outcome.
  string reason = 11;
  int64 updated_at_unix_ms = 12;
  uint64 credential_generation = 13;
  bool credential_issued = 14;
  string credential_operation_id = 15;
}

// Host -> Access result of REQUEST_KIND_HOST_CLIENTS. No Session content or IDs.
message HostClients {
  repeated string observing_device_ids = 1;
}


// Device -> Host proof of possession for the App-session proof key. The
// signature covers session/host/device/channel/transcript/issued/expires.
message SessionProof {
  string session_id = 1;
  string host_id = 2;
  string device_id = 3;
  string channel_id = 4;
  bytes transcript_hash = 5;
  int64 issued_at_unix_ms = 6;
  int64 expires_at_unix_ms = 7;
  bytes signature = 8;
}
