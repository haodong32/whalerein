syntax = "proto3";

package whalerein.v1;

option go_package = "github.com/whalerein/whalerein/proto/v1/bindings/go;whalereinv1";

// The only wire contract for WhaleRein first version.
//
// HTTPS uses the proto3 JSON encoding of these messages. MQTT carries the
// binary protobuf encoding. There is no second OpenAPI or JSON Schema.

// ---------------------------------------------------------------------------
// Enumerations
// ---------------------------------------------------------------------------

// Lowercase enum value names are intentional: proto3 JSON encodes an enum as
// its value name, so the online status strings on the wire are exactly the
// names required by the architecture (received, host_offline, ...).
enum OnlineStatus {
  online_status_unspecified = 0;
  received = 1;
  host_offline = 2;
  rejected = 3;
  host_accepted = 4;
  succeeded = 5;
  failed = 6;
  unknown = 7;
}

enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  // A Noise XX handshake message. `body` is raw Noise bytes.
  REQUEST_KIND_HANDSHAKE = 1;
  // An encrypted query. `body` is an EncryptedFrame.
  REQUEST_KIND_QUERY = 2;
  // An encrypted control command. `body` is an EncryptedFrame.
  REQUEST_KIND_COMMAND = 3;
  // A first-registration pairing claim. `body` is a PairingClaim.
  REQUEST_KIND_PAIRING_CLAIM = 4;
  // Access -> host authorization notice, after Access wrote devices/grants.
  REQUEST_KIND_PAIRING_AUTHORIZE = 5;
  // Access -> host revocation replay notice.
  REQUEST_KIND_REVOCATION = 6;
}

enum ErrorCode {
  error_code_unspecified = 0;
  invalid_argument = 1;
  unauthorized = 2;
  forbidden = 3;
  not_found = 4;
  conflict = 5;
  expired = 6;
  unsupported_capability = 7;
  protocol_version_incompatible = 8;
  payload_digest_mismatch = 9;
  approval_expired = 10;
  approval_version_mismatch = 11;
  approval_already_resolved = 12;
  approval_unavailable = 13;
  snapshot_required = 14;
  revocations_pending = 15;
  rate_limited = 16;
  internal = 17;
  unavailable = 18;
  payload_too_large = 19;
}

enum Capability {
  capability_unspecified = 0;
  sessions = 1;
  events = 2;
  messages = 3;
  approvals = 4;
  interrupt = 5;
  sync = 6;
  snapshot = 7;
}

enum PairingPhase {
  PAIRING_PHASE_UNSPECIFIED = 0;
  PAIRING_PHASE_HELLO = 1;
  PAIRING_PHASE_FINISH = 2;
  // Internal Access -> host step. Never accepted from a public request.
  PAIRING_PHASE_AUTHORIZE = 3;
  // Internal commit after Access atomically activates the grant.
  PAIRING_PHASE_COMMIT = 4;
}



enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_REJECTED = 3;
  APPROVAL_STATE_EXPIRED = 4;
  APPROVAL_STATE_UNAVAILABLE = 5;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_REJECT = 2;
}

// ---------------------------------------------------------------------------
// Host request / result envelopes
// ---------------------------------------------------------------------------

message CapabilitySet {
  repeated Capability capabilities = 1;
  uint32 protocol_version = 2;
}

message HostRequest {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  RequestKind kind = 4;
  // Empty for handshakes and queries. Control commands carry an opaque random
  // id plus the SHA-256 of `body`.
  string command_id = 5;
  bytes payload_digest = 6;
  int64 expires_at_unix_ms = 7;
  // Diagnostic correlation only. Never an idempotency key.
  string trace_id = 8;
  uint32 protocol_version = 9;
  // Selected secure channel. Empty while a channel is being established.
  string channel_id = 10;
  // Opaque to Access: raw Noise handshake bytes, an EncryptedFrame, a
  // PairingClaim, or a RevocationNotice depending on `kind`.
  bytes body = 11;
  // Device receiver capability, preserved by Access when relaying.
  uint32 client_transport_version = 12;
  // Access receiver capability, set by Access before MQTT forwarding.
  uint32 relay_transport_version = 13;
}

message HostResult {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  OnlineStatus status = 4;
  string command_id = 5;
  bytes payload_digest = 6;
  // Opaque to Access: raw Noise handshake bytes, an EncryptedFrame, or a
  // PairingClaimResult. Access stores it verbatim.
  bytes result_body = 7;
  ErrorCode error_code = 8;
  string trace_id = 9;
  // Sanitized diagnostic text. Never contains content, payloads or keys.
  string error_message = 10;
  int64 completed_at_unix_ms = 11;
  uint32 protocol_version = 12;
  string channel_id = 13;
}

message ErrorResponse {
  ErrorCode code = 1;
  string message = 2;
  string trace_id = 3;
  string request_id = 4;
}

message RequestReceipt {
  string request_id = 1;
  OnlineStatus status = 2;
  string command_id = 3;
  int64 expires_at_unix_ms = 4;
}

message RequestState {
  string request_id = 1;
  string host_id = 2;
  string device_id = 3;
  OnlineStatus status = 4;
  string command_id = 5;
  bytes payload_digest = 6;
  bytes result_body = 7;
  ErrorCode error_code = 8;
  string error_message = 9;
  int64 expires_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
  string channel_id = 12;
}

message HostInfo {
  string host_id = 1;
  bool online = 2;
  uint32 protocol_version = 3;
  string fingerprint = 4;
}

message HostList {
  repeated HostInfo hosts = 1;
}

// ---------------------------------------------------------------------------
// Pairing
// ---------------------------------------------------------------------------

message PairingInvitationRequest {
  string host_id = 1;
  // Host callers set these and send no bearer token. The signature is Ed25519
  // over whalerein/v1/host-auth|invitation|{host_id}||{signed_at_unix_ms}.
  // The seed is the host Noise private key. Administrators omit both fields
  // and authenticate with the admin bearer instead.
  int64 signed_at_unix_ms = 2;
  bytes signature = 3;
}

message PairingInvitation {
  string token = 1;
  string host_id = 2;
  int64 expires_at_unix_ms = 3;
  // whalerein://pair?... The token is embedded once and is never logged.
  string pairing_uri = 4;
}

message PairingClaimRequest {
  string token = 1;
  // Client-generated, random, opaque. Correlates the two public steps.
  string claim_id = 2;
  PairingPhase phase = 3;
  // Raw Noise XX message (message 1 for HELLO, message 3 for FINISH).
  bytes noise_message = 4;
  string device_id = 5;
  uint32 protocol_version = 6;
  // The user confirmed the host fingerprint shown after HELLO.
  bool confirmed = 7;
  // Client-generated random credential; its hash is authenticated inside Noise FINISH.
  // Never logged or persisted by Access. Required for FINISH.
  string device_token = 8;
}

message PairingClaimResponse {
  string claim_id = 1;
  string host_id = 2;
  PairingPhase phase = 3;
  // Raw Noise XX message returned by the host for HELLO. Empty for FINISH.
  bytes noise_message = 4;
  bytes host_public_key = 5;
  string host_fingerprint = 6;
  string device_id = 7;
  bytes device_public_key = 8;
  // Echo of the client-generated credential after confirmed Host activation.
  string device_token = 9;
  int64 expires_at_unix_ms = 10;
  uint32 protocol_version = 11;
}

// Access -> host, carried as the body of a REQUEST_KIND_PAIRING_CLAIM request.
message PairingClaim {
  string claim_id = 1;
  // Hex SHA-256 of the one-time token. Bound into the Noise prologue.
  string token_hash = 2;
  PairingPhase phase = 3;
  bytes noise_message = 4;
  string device_id = 5;
  // Present on AUTHORIZE only.
  bytes device_public_key = 6;
  int64 expires_at_unix_ms = 7;
  // Access-assigned grant incarnation, populated on COMMIT.
  uint64 grant_generation = 8;
  // SHA-256 of the client transport credential, verified against Noise FINISH.
  bytes device_auth_hash = 9;
}

// Host -> Access, carried as HostResult.result_body for a pairing claim.
message PairingClaimResult {
  bytes noise_message = 1;
  bytes host_public_key = 2;
  string host_fingerprint = 3;
  string device_id = 4;
  bytes device_public_key = 5;
  bool authorized = 6;
  bytes device_auth_hash = 7;
}

// Access -> host, carried as the body of a REQUEST_KIND_REVOCATION request.
message RevocationNotice {
  string replay_id = 1;
  repeated string device_ids = 2;
  bool final = 3;
  int64 revoked_at_unix_ms = 4;
  // One incarnation per device; missing entries refer only to legacy generation 0.
  map<string, uint64> grant_generations = 5;
}

// Host -> Access, carried as HostResult.result_body for a revocation notice.
message RevocationAck {
  string replay_id = 1;
  repeated string device_ids = 2;
}

// Host -> Access readiness signal, carried as result_body on the result topic
// with an empty request_id and status succeeded.
message HostReady {
  string host_id = 1;
  int64 connected_at_unix_ms = 2;
  // Ed25519 public key registered on the authenticated MQTT session.
  // The first key for a host is kept.
  bytes authorization_public_key = 3;
  uint32 transport_version = 4;
}

// Host-scoped grant revocation. The host id and device id come from the URL.
// The signature covers whalerein/v1/host-auth|revoke|{host_id}|{device_id}|{signed_at_unix_ms}.
message HostGrantRevocation {
  int64 signed_at_unix_ms = 1;
  bytes signature = 2;
}

// ---------------------------------------------------------------------------
// Secure channel
// ---------------------------------------------------------------------------

// Authenticated encryption envelope used after the Noise XX handshake.
// nonce is 12 random bytes; ciphertext is ChaCha20-Poly1305 output.
message EncryptedFrame {
  string channel_id = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
}

// Noise payload for handshake message 1 (initiator -> responder).
message ChannelHello {
  string device_id = 1;
  string host_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string client_nonce = 5;
}

// Noise payload for handshake message 2 (responder -> initiator).
message ChannelReady {
  string host_id = 1;
  string device_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string host_nonce = 5;
}

// Noise payload for pairing message 1.
message PairingHello {
  string device_id = 1;
  string host_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string device_nonce = 5;
  string display_name = 6;
  // OS token reported by the client: linux, macos, ios, windows, android,
  // freebsd, dragonfly, netbsd, openbsd, or solaris. A label only. Access
  // cannot see this Noise field.
  string os = 7;
}

// Noise payload for pairing message 2.
message PairingHelloReply {
  string host_id = 1;
  string device_id = 2;
  uint32 protocol_version = 3;
  CapabilitySet capabilities = 4;
  string host_nonce = 5;
}

// Noise payload for pairing message 3. Confirms the user-visible fingerprint.
message PairingFinish {
  string device_id = 1;
  string host_id = 2;
  string host_fingerprint = 3;
  bytes device_auth_hash = 4;
}

// ---------------------------------------------------------------------------
// Encrypted query and command payloads
// ---------------------------------------------------------------------------

message RequestPayload {
  oneof payload {
    ListSessions list_sessions = 1;
    GetSession get_session = 2;

    GetApproval get_approval = 4;
    GetCommandResult get_command_result = 5;
    SendMessage send_message = 6;
    Interrupt interrupt = 7;
    ResolveApproval resolve_approval = 8;
    Ping ping = 9;
    ListApprovals list_approvals = 10;
    HistoryRead read_history = 11;
    WatchSession watch_session = 12;
    RefreshWatches refresh_watches = 13;
    UnwatchSession unwatch_session = 14;
  }
}

message ResponsePayload {
  oneof payload {
    SessionList session_list = 1;


    Approval approval = 4;
    CommandAccepted command_accepted = 5;
    CommandResult command_result = 6;
    Pong pong = 7;
    ApprovalList approval_list = 10;
    HistoryPage history_page = 11;
    WatchReady watch_ready = 12;
    WatchStates watch_states = 13;
    SessionSummary session_info = 14;
  }
  // Domain failure. HostResult.status carries the online status copy.
  ErrorCode error_code = 8;
  string error_detail = 9;
}

message ListSessions {}

message GetSession {
  string session_id = 1;
}



message GetApproval {
  string approval_id = 1;
}

message ListApprovals {
  // Optional session filter. Empty lists every pending approval known to the
  // host.
  string session_id = 1;
}

message ApprovalList {
  repeated Approval approvals = 1;
}

message GetCommandResult {
  string command_id = 1;
}

message SendMessage {
  string session_id = 1;
  string text = 2;
  DeliveryMode delivery_mode = 3;
}

message Interrupt {
  string session_id = 1;
}

message ResolveApproval {
  string approval_id = 1;
  ApprovalDecision decision = 2;
  bytes expected_digest = 3;
  int64 expected_version = 4;
}

message Ping {
  int64 client_time_unix_ms = 1;
}

message Pong {
  int64 host_time_unix_ms = 1;
}

message SessionSummary {
  string session_id = 1;
  string title = 2;
  string cwd = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
  bool running = 6;
  bool agent_available = 7;
  bool blank = 8;
  string parent_session_id = 9;
  string origin = 10;
  uint32 queued_prompts = 12;
  string history_cursor = 13;
  SourceCapabilities source_capabilities = 14;
}

message SessionList {
  repeated SessionSummary sessions = 1;
}







message CommandAccepted {
  string message_id = 1;
}

message CommandResult {
  bool found = 1;
  OnlineStatus status = 2;
  // Serialized ResponsePayload of the original terminal command result.
  bytes result_payload = 3;
  ErrorCode error_code = 4;
}

message Approval {
  string approval_id = 1;
  string session_id = 2;
  string tool_name = 3;
  string call_id = 4;
  string reason = 5;
  // SHA-256 over the canonical approval fields, including version and expiry.
  bytes digest = 6;
  int64 version = 7;
  int64 expires_at_unix_ms = 8;
  ApprovalState state = 9;
  ApprovalDecision decision = 10;
}

// ---------------------------------------------------------------------------
// Event envelope (MQTT)
// ---------------------------------------------------------------------------

message EventEnvelope {
  string host_id = 1;
  string device_id = 2;
  string channel_id = 3;
  bytes nonce = 4;
  bytes ciphertext = 5;
  int64 created_at_unix_ms = 6;
  string trace_id = 7;
}

// Encrypted event plaintext.
message EventPayload {
  SessionUpdate update = 1;
}

// Opaque MQTT fragmentation. A packet starts with ASCII WRMQTT2 followed by
// this protobuf. V2 uses 60 KiB chunks inside a 64 KiB packet budget, with a
// 16 MiB logical envelope budget. Hashes cover opaque encoded envelopes, not
// a separate plaintext-content digest.
message TransportFrame {
  uint32 version = 1;
  string transfer_id = 2;
  string topic = 3;
  uint32 index = 4;
  uint32 count = 5;
  uint32 total_bytes = 6;
  bytes digest = 7;
  bytes payload = 8;
  bool ack = 9;
  bool rejected = 10;
  // Only true after the entire logical envelope passed integrity checks.
  bool complete = 11;
}

// Normalized conversation domain. Sources interpret native identifiers; clients
// never decode their payload shapes or compare history cursors numerically.
message SessionKey { string host_id = 1; string session_id = 2; }
message SourceCapabilities {
  bool history = 1; bool resumable_history = 2; bool live_text = 3;
  bool interrupt = 4; bool approvals = 5;
  repeated DeliveryMode delivery_modes = 6;
}
enum DeliveryMode { DELIVERY_MODE_UNSPECIFIED = 0; START_IF_IDLE = 1; ENQUEUE_AFTER_RUN = 2; STEER = 3; }
enum MessageRole { MESSAGE_ROLE_UNSPECIFIED = 0; USER = 1; ASSISTANT = 2; TOOL = 3; NOTICE = 4; }
enum RunPhase { RUN_PHASE_UNSPECIFIED = 0; IDLE = 1; RUNNING = 2; STOPPING = 3; SOURCE_UNAVAILABLE = 4; }
enum AttemptOutcome { ATTEMPT_OUTCOME_UNSPECIFIED = 0; COMMITTED = 1; ABANDONED = 2; INTERRUPTED = 3; ATTEMPT_FAILED = 4; }
message AttemptRef { string live_epoch = 1; string attempt_id = 2; }
message TextContent { string text = 1; }
message ToolCallContent { string call_id = 1; string name = 2; string summary = 3; }
message ToolResultContent { string call_id = 1; string text = 2; bool is_error = 3; }
message NoticeContent { string category = 1; string text = 2; }
message AttachmentContent { string media_type = 1; string name = 2; uint64 size = 3; bool available = 4; }
message ContentBlock {
  string block_id = 1;
  oneof content { TextContent text = 2; ToolCallContent tool_call = 3;
    ToolResultContent tool_result = 4; NoticeContent notice = 5; AttachmentContent attachment = 6; }
}
message ConversationMessage {
  string message_id = 1; MessageRole role = 2; repeated ContentBlock blocks = 3;
  int64 authored_at_unix_ms = 4;
}
message MessageUpsert { ConversationMessage message = 1; AttemptRef origin = 2; }
message HistoryBatch {
  string from_cursor = 1; string to_cursor = 2; string batch_id = 3;
  repeated MessageUpsert changes = 4;
}
message HistoryRead {
  string session_id = 1; bool snapshot = 2;
  string after_cursor = 3; string cut_cursor = 4;
  uint32 max_bytes = 5; uint32 max_messages = 6;
}
message HistoryPage {
  SessionKey session = 1; HistoryBatch batch = 2;
  string cut_cursor = 3; bool complete = 4; bool snapshot = 5;
}
message AttemptStarted {}
message AttemptEnded { AttemptOutcome outcome = 1; }
message LiveFrame {
  AttemptRef attempt = 1; string block_id = 2; uint64 first_seq = 3; uint64 last_seq = 4;
  oneof payload { AttemptStarted started = 5; TextContent delta = 6;
    TextContent reset = 7; AttemptEnded ended = 8; }
}
message SessionState {
  SessionKey session = 1; string live_epoch = 2; uint64 revision = 3;
  string history_head = 4; RunPhase run_phase = 5; repeated Approval approvals = 6;
}
message HistoryReset { string reason = 1; }
message SessionUpdate {
  string watch_id = 1; SessionKey session = 2;
  oneof payload { HistoryBatch history = 3; LiveFrame live = 4;
    SessionState state = 5; HistoryReset reset = 6; }
}
message WatchSession { string session_id = 1; }
message WatchReady { string watch_id = 1; SessionState state = 2; uint32 lease_ms = 3; }
message RefreshWatches { repeated string watch_ids = 1; }
message WatchStates { repeated WatchReady watches = 1; }
message UnwatchSession { string watch_id = 1; }
