[package]
name = "whalerein-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WhaleRein client core"

[features]
default = ["keyring"]
keyring = ["dep:keyring"]
# Test-only fake Access/host fixture for the CLI and Core integration tests.
test-support = []
# Low-level drivers used by repository protocol and transport tests.
protocol-testing = []

[dependencies]
whalerein-proto = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { workspace = true }
directories = { workspace = true }
fs4 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
prost = { workspace = true }
rand = { workspace = true }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = { workspace = true }
toml_edit = { version = "0.25", features = ["serde"] }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { version = "2", features = ["serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

# MQTT 5 is built directly on the rustls version used by rumqttc.
# Share reqwest's ring provider instead of also compiling aws-lc-rs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "1"

[target.'cfg(any(target_vendor = "apple", windows))'.dependencies]
rustls-platform-verifier = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"], optional = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"], optional = true }

[dev-dependencies]
hkdf = { workspace = true }
rcgen = "0.14"
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[[example]]
name = "mqtt_transport_driver"
required-features = ["protocol-testing"]

[[example]]
name = "delivery_driver"
required-features = ["protocol-testing"]

[[example]]
name = "wait_concurrency_driver"
required-features = ["protocol-testing"]
