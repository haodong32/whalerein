# WhaleRein Mosquitto line configuration (pinned broker 2.1.4).
#
# The plugin keeps MQTT admission, ACL, presence and control local. External
# clients use the existing WhaleRein topic grammar, TLS identity and
# credentials. The Access service account authenticates against this plugin's
# local bootstrap credential so the control path survives Access restarts.

allow_anonymous false
persistence false
# Parameterized broker PUBLISH ceiling. The container entrypoint renders this
# value from WHALEREIN_MQTT_MAX_PACKET_SIZE (default 1 MiB, the packaged
# brokerPacketLimitBytes) so a deployment change does not require a config
# rebuild. Every transport profile packet budget must stay <= this value; the
# complete packet budget (default 64 KiB) and the logical envelope budget
# (default 16 MiB) are independent Access transport settings. Mosquitto's MQTT
# 5 Receive Maximum is negotiated on each connection, not set here.
max_packet_size 1048576
sys_interval 0

listener 1883 0.0.0.0
protocol mqtt
# Small control/event frames must not wait on Nagle plus delayed ACK; the
# streaming acceptance measured ~40 ms batching without it.
set_tcp_nodelay true
max_connections -1

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages false

# Relay epoch 4 policy is computed by Access and enforced by the plugin from
# the authenticated connection. Control topics (request/result/event plus
# device event/notice/ready) use QoS 1. The Host live topic and the Device live
# topic use QoS 0 and are lossy. There is no static ACL file, fragment topic or
# device ack topic.

# Plugin options are deployment configuration, not device credentials. The
# Access password and internal token are mounted from the deployment secret
# store; the plugin never stores device credentials.
plugin /usr/lib/mosquitto/whalerein.so
plugin_opt_access_username access
plugin_opt_access_password_file /run/whalerein/mqtt-access-password
plugin_opt_access_auth_url http://access:8081/internal/broker/connect
plugin_opt_access_auth_token_file /run/whalerein/internal-token
plugin_opt_auth_timeout_ms 500
plugin_opt_auth_workers 8
plugin_opt_policy_ttl_ms 15000
