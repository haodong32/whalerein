mode: standalone
# Compose-local Access configuration. Secrets come from the compose
# environment, never from this file.
listen: "0.0.0.0:8080"
internal_listen: "0.0.0.0:8081"
public_url: "http://127.0.0.1:8080"
database_url: "${WHALEREIN_DATABASE_URL}"
admin_token: "${WHALEREIN_ADMIN_TOKEN}"
host_provisioning_token: "${WHALEREIN_HOST_PROVISIONING_TOKEN}"

broker:
  url: "mqtt://mosquitto:1883"
  public_url: "mqtt://127.0.0.1:1883"
  client_id: "whalerein-access"
  username: "access"
  password: "${WHALEREIN_BROKER_PASSWORD}"
  connect_timeout: 10s
  publish_timeout: 5s
  keep_alive: 30s
  reconnect_min: 500ms
  reconnect_max: 10s

line:
  policy_ttl: 10s
  reconcile_interval: 30s
  heartbeat_interval: 5s
  operation_timeout: 5s

admission:
  max_entries: 10000
  ttl: 5m
  load_timeout: 250ms
  max_background_loads: 64

internal:
  callback_token: "${WHALEREIN_INTERNAL_TOKEN}"

pairing:
  invitation_ttl: 10m
  claim_timeout: 10s
  claim_ttl: 5m
  max_failures: 5

requests:
  max_ttl: 1h
  forward_interval: 200ms
  lease: 5s
  retry_interval: 1s
  max_attempts: 5
  batch_size: 50

revocation:
  ack_timeout: 5s

presence:
  # Must stay >= line.reconcile_interval (30s) and > line.heartbeat_interval
  # (5s). A short cache would make presence flap between reconciles.
  cache_ttl: 60s

cleanup:
  interval: 1m
  pairing_token_retention: 1h

protocol:
  version: 1

log:
  level: debug
