mode: standalone
# Compose-local Access configuration. Secrets come from the compose
# environment, never from this file.
listen: "0.0.0.0:8080"
internal_listen: "0.0.0.0:8081"
public_url: "http://127.0.0.1:8080"
database_url: "${WHALEREIN_DATABASE_URL}"
admin_token: "${WHALEREIN_ADMIN_TOKEN}"
host_provisioning_token: "${WHALEREIN_HOST_PROVISIONING_TOKEN}"

broker:
  url: "mqtt://mosquitto:1883"
  public_url: "mqtt://127.0.0.1:1883"
  client_id: "whalerein-access"
  username: "access"
  password: "${WHALEREIN_BROKER_PASSWORD}"
  connect_timeout: 10s
  publish_timeout: 5s
  keep_alive: 30s
  reconnect_min: 500ms
  reconnect_max: 10s

line:
  policy_ttl: 10s
  reconcile_interval: 30s
  heartbeat_interval: 5s
  operation_timeout: 5s

admission:
  max_entries: 10000
  ttl: 5m
  load_timeout: 250ms
  max_background_loads: 64

internal:
  callback_token: "${WHALEREIN_INTERNAL_TOKEN}"

pairing:
  invitation_ttl: 10m
  claim_timeout: 10s
  claim_ttl: 5m
  max_failures: 5

# Shared encoded transport budget. The profile vocabulary lives in
# proto/v1/transport_profiles.json; every value below is an optional override
# that must satisfy the same relations. Invalid settings fail startup with a
# config error before /readyz can turn green. Changes require a restart.
transport:
  # Render the profile from the deployment environment. Both Access and the
  # Host/client profile must select the same packaged name.
  profile: "${WHALEREIN_TRANSPORT_PROFILE:-default}"
  # The packaged default is a 64 KiB complete encoded MQTT packet and a 16 MiB
  # logical envelope. Every profile packet budget must stay <= the broker
  # ceiling in proto/v1/transport_profiles.json (1 MiB) and the rendered
  # Mosquitto max_packet_size. Override only with the same values on Access,
  # the Host and clients.
  # packet_bytes: 65536
  # packet_overhead_bytes: 4096
  # envelope_bytes: 16777216
  # bulk_concurrency: 4
  # reserved_bytes: 33554432
  # transfer_timeout: 120s
  # Ordered MQTT 5 publisher flow control. Receive Maximum is advertised in
  # CONNECT; the CONNACK value can only lower the in-flight bound. There is no
  # application ACK topic in relay epoch 3.
  receive_maximum: 16
  send_in_flight: 16
  # Per-destination ordered queue bound and the total waiting bytes across the
  # publisher. Exhaustion returns a typed error instead of blocking a sibling
  # flow.
  send_queue_depth: 1024
  send_queue_bytes: 33554432
  # Raw ciphertext retained for one encrypted result. Omitted derives from the
  # profile envelope and may not exceed it.
  # result_limit_bytes: 16777216

requests:
  max_ttl: 1h
  forward_interval: 200ms
  lease: 5s
  retry_interval: 1s
  max_attempts: 5
  batch_size: 50
  # max_result_bytes derives from the transport profile envelope when omitted.
  # http.max_body_bytes derives from the encoded result bound when omitted.

revocation:
  ack_timeout: 5s

presence:
  # Must stay >= line.reconcile_interval (30s) and > line.heartbeat_interval
  # (5s). A short cache would make presence flap between reconciles.
  cache_ttl: 60s

cleanup:
  interval: 1m
  pairing_token_retention: 1h

# Temporary ciphertext directory for oversized relay payloads and attachment
# parts. The values below are development defaults that match the packaged
# default profile (64 KiB packet / 16 MiB envelope) and the Compose payload
# volume. An operator must size max_node_bytes plus free_space_reserve_bytes
# inside the provisioned volume and keep this directory on one dedicated
# filesystem. Production TLS/ingress and multi-node owner paths are operator
# inputs, not settings in this file.
storage:
  enabled: true
  # Mounted by the Compose payload volume. Access creates objects/ and tmp/
  # here and proves the directory writable before /readyz turns green.
  root_dir: "/var/lib/whalerein/payloads"
  # Stable node identity and the opaque owner id carried in a PayloadReference.
  # Keep node_id unique per Access node; owner_id defaults to node_id.
  node_id: "access-1"
  owner_id: "access-1"
  # Raw ciphertext bytes: one object, one Host, the whole node. Keep
  # max_object_bytes at or below the packaged default envelope (16 MiB); the
  # profile envelope bounds every relay upload.
  max_object_bytes: 16777216
  max_host_bytes: 268435456
  max_node_bytes: 1073741824
  max_objects: 1024
  max_active_uploads: 16
  # No admission below this much free space on the payload filesystem.
  free_space_reserve_bytes: 1073741824
  # Hard lifetime cap; a parent request/transfer deadline can only shorten it.
  retention: 24h
  cleanup_interval: 30s
  cleanup_batch: 100
  # One upload or fetch is bounded by these; upload_timeout must not exceed
  # retention.
  upload_timeout: 2m
  read_timeout: 60s

protocol:
  version: 1

log:
  level: debug
