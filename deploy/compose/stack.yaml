# One-command WhaleRein server stack:
#   docker compose -f deploy/compose/stack.yaml up -d --build
#
# Services: Mosquitto 2.1.4 (WhaleRein plugin) and one independent Access node.
# The DSH plugin runs on the DSH host (not in this compose) and connects to the
# published MQTT port. MQTT is plaintext on loopback and Access is HTTP.
# Published ports are loopback-only.

name: whalerein

services:
  mosquitto:
    image: whalerein-mosquitto:local
    build:
      context: ../..
      dockerfile: deploy/docker/mosquitto.Dockerfile
    container_name: whalerein-mosquitto
    restart: unless-stopped
    environment:
      WHALEREIN_BROKER_PASSWORD: "${WHALEREIN_BROKER_PASSWORD:-dev-broker-password}"
      WHALEREIN_INTERNAL_TOKEN: "compose-internal-token"
      # Broker PUBLISH ceiling. The packaged brokerPacketLimitBytes is 1 MiB
      # and every transport profile packet budget must not exceed it. The
      # entrypoint renders the mounted config from this value.
      WHALEREIN_MQTT_MAX_PACKET_SIZE: "${WHALEREIN_MQTT_MAX_PACKET_SIZE:-1048576}"
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - "../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  access:
    image: whalerein-access:local
    build:
      context: ../..
      dockerfile: deploy/docker/access.Dockerfile
    container_name: whalerein-access
    restart: unless-stopped
    environment:
      WHALEREIN_DATABASE_PATH: "/var/lib/whalerein/data/access.db"
      WHALEREIN_ADMIN_TOKEN: "${WHALEREIN_ADMIN_TOKEN:-dev-admin-token}"
      WHALEREIN_HOST_PROVISIONING_TOKEN: "${WHALEREIN_HOST_PROVISIONING_TOKEN:-dev-host-token}"
      WHALEREIN_BROKER_PASSWORD: "${WHALEREIN_BROKER_PASSWORD:-dev-broker-password}"
      WHALEREIN_INTERNAL_TOKEN: "compose-internal-token"
      # Must match the Host/client transport profile. Access fails startup on
      # an unknown or invalid profile, and derives HTTP result bounds from it.
      WHALEREIN_TRANSPORT_PROFILE: "${WHALEREIN_TRANSPORT_PROFILE:-default}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ../compose/access.yaml:/etc/whalerein/access.yaml:ro
      # One node-local durable volume. SQLite holds grants, pairing state,
      # queue state and result metadata; the payloads directory holds
      # temporary ciphertext. Nothing here is synchronized to Central.
      - access-data:/var/lib/whalerein/data
      - access-payloads:/var/lib/whalerein/payloads
    # Access stops its HTTP servers and workers within a 10 s budget. Give
    # Docker a longer grace period so SIGKILL never races that budget.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  default:
    name: whalerein

volumes:
  access-data:
    name: whalerein-access-data
  access-payloads:
    name: whalerein-access-payloads
