# One-command WhaleRein server stack:
#   docker compose -f deploy/compose/stack.yaml up -d --build
#
# Services: PostgreSQL 18, Mosquitto 2.1.2 (WhaleRein plugin), WhaleRein Access.
# The DSH plugin runs on the DSH host (not in this compose) and connects to the
# published MQTT port. MQTT is plaintext on loopback and Access is HTTP.
# Published ports are loopback-only.

name: whalerein

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73
    container_name: whalerein-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: whalerein_dev
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ../../.data/docker/postgres:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    # Bound container log growth: at most 3 x 10 MiB per service. See
    # docs/deploy.md#log-growth-and-rotation for the operational contract.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whalerein_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mosquitto:
    image: whalerein-mosquitto:local
    build:
      context: ../..
      dockerfile: deploy/docker/mosquitto.Dockerfile
    container_name: whalerein-mosquitto
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WHALEREIN_BROKER_PASSWORD: "${WHALEREIN_BROKER_PASSWORD:-dev-broker-password}"
      WHALEREIN_INTERNAL_TOKEN: "compose-internal-token"
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - "../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  access:
    image: whalerein-access:local
    build:
      context: ../..
      dockerfile: deploy/docker/access.Dockerfile
    container_name: whalerein-access
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WHALEREIN_DATABASE_URL: "postgres://postgres@postgres:5432/whalerein_dev?sslmode=disable"
      WHALEREIN_ADMIN_TOKEN: "${WHALEREIN_ADMIN_TOKEN:-dev-admin-token}"
      WHALEREIN_HOST_PROVISIONING_TOKEN: "${WHALEREIN_HOST_PROVISIONING_TOKEN:-dev-host-token}"
      WHALEREIN_BROKER_PASSWORD: "${WHALEREIN_BROKER_PASSWORD:-dev-broker-password}"
      WHALEREIN_INTERNAL_TOKEN: "compose-internal-token"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ../compose/access.yaml:/etc/whalerein/access.yaml:ro
    # Access stops its HTTP servers and workers within a 10 s budget. Give
    # Docker a longer grace period so SIGKILL never races that budget.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  default:
    name: whalerein
