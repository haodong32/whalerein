# Transport-only regression broker. Auth/ACL have separate package tests.
# Use only with loopback port publishing and synthetic fixture messages.
node {
  name = "emqx@127.0.0.1"
  data_dir = "/opt/emqx/data"
  cookie = "whalerein-transport-test"
}
cluster {
  name = whalerein_transport_test
  discovery_strategy = manual
}
log.console {
  enable = true
  level = error
}
listeners {
  tcp.default { bind = "0.0.0.0:1883" }
  ssl.default { bind = 0 }
  ws.default { bind = 0 }
  wss.default { bind = 0 }
}
mqtt { max_packet_size = "1MB" }
authentication = []
authorization {
  no_match = allow
  sources = []
}
