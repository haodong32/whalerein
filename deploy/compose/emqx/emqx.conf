## Compose-local EMQX 5.8 configuration.
## Auth/ACL callbacks go to the Access service on the compose network.

# Client connected/disconnected events must reach Access promptly; the MQTT
# keepalive is 10s and Access turns the event into a Host presence signal.
node {
  name = "emqx@127.0.0.1"
  cookie = "whalerein-compose-cookie"
  data_dir = "/opt/emqx/data"
}

# Logical messages are fragmented into packets below 64 KiB by the adapters.
# No application snapshot depends on an enlarged broker packet budget.
mqtt {
  max_packet_size = "1MB"
}

cluster {
  name = whalerein
  discovery_strategy = manual
}

log {
  console {
    enable = true
    level = warning
  }
}

dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}

api_key {
  bootstrap_file = "/opt/emqx/etc/api-keys.csv"
}

listeners {
  tcp.default {
    bind = "0.0.0.0:1883"
    enable_authn = true
  }
  # Access's own control-plane connection uses this internal listener. It is
  # not published to the host, so the service account cannot depend on Access's
  # HTTP auth endpoint during startup or after an outage.
  tcp.internal {
    bind = "0.0.0.0:1884"
    enable_authn = false
  }
  ssl.default { bind = 0 }
  ws.default { bind = 0 }
  wss.default { bind = 0 }
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://access:8081/internal/broker/auth"
    request_timeout = "5s"
    headers {
      "content-type" = "application/json"
      "x-whalerein-internal-token" = "compose-internal-token"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
    }
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    },
    {
      type = http
      method = post
      url = "http://access:8081/internal/broker/acl"
      request_timeout = "5s"
      headers {
        "content-type" = "application/json"
        "x-whalerein-internal-token" = "compose-internal-token"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}
