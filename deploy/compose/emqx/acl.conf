%% Access control-plane account used on the internal listener (1884).
%% `whalerein/v1/#` includes host presence and device last-will topics. Device
%% and Host permissions on those topics still come from the HTTP ACL callback.
{allow, {user, "access"}, all, ["whalerein/v1/#", "$SYS/brokers/+/clients/+/connected", "$SYS/brokers/+/clients/+/disconnected"]}.
